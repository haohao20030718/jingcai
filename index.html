<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<title>足球竞彩台</title>
<!-- 手机装到桌面：Android 走 manifest，iOS 走 apple-mobile-web-app-* -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1F4E79">
<script>
/* 离线能力：注册 Service Worker（file:// 打开时跳过；http/https 才注册） */
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="竞彩台">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
:root{
  --bg:#F5F6F4; --card:#FFFFFF; --ink:#14181D; --ink2:#3A424C; --muted:#6C7480;
  --line:#E4E7E4; --line2:#EEF0ED;
  --accent:#1F4E79; --accent-2:#2E6CA4; --accent-weak:#EDF2F8;
  --win:#B03A2E; --lose:#1E7B4F; --push:#8A8F98; --warn:#9A6B00;
  --r:10px; --sh:0 1px 2px rgba(20,24,29,.05),0 1px 8px rgba(20,24,29,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px; line-height:1.5;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--accent)}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:40;background:rgba(245,246,244,.94);
  backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
.hd{max-width:920px;margin:0 auto;padding:10px 14px 9px;display:flex;align-items:center;gap:12px}
.hd h1{font-size:16px;font-weight:650;margin:0;letter-spacing:.2px;white-space:nowrap}
.hd .sub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54vw}
.hd .sp{flex:1}
.hd .net{text-align:right;line-height:1.15}
.hd .net b{font-size:19px;font-weight:660;letter-spacing:-.3px;display:block}
.hd .net i{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.4px}
.hd3{max-width:920px;margin:0 auto;padding:0 14px 9px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hd3>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:0}
.hd3 .k{font-size:10.5px;color:var(--muted);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd3 .v{font-size:16px;font-weight:660;letter-spacing:-.3px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.pk-chip{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink2)}
.pk-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pk-row{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
.pk-row.on{border-color:var(--accent);background:var(--accent-weak)}
.pk-row .cb{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;flex:0 0 auto;
  display:grid;place-items:center;font-size:13px;color:#fff}
.pk-row.on .cb{background:var(--accent);border-color:var(--accent)}
.pk-row .mid{flex:1;min-width:0}
.pk-row .t1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row .t2{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-row .sc{font-size:14px;font-weight:660;color:var(--ink);white-space:nowrap}
.chip{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;background:var(--accent-weak);
      color:var(--accent);border:1px solid #DCE6F0;vertical-align:1px}

/* ---------- tabs ---------- */
nav.tabs{max-width:920px;margin:0 auto;padding:0 8px 8px;display:flex;gap:2px}
nav.tabs button{
  flex:1;padding:8px 1px 7px;font-size:12.5px;color:var(--muted);border-radius:8px;
  position:relative;font-weight:500;min-height:38px;
}
nav.tabs button.on{color:var(--accent);font-weight:640;background:var(--accent-weak)}
nav.tabs button .dot{position:absolute;top:5px;right:calc(50% - 26px);width:5px;height:5px;border-radius:50%;background:var(--warn)}

/* ---------- layout ---------- */
main{max-width:920px;margin:0 auto;padding:12px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{margin:16px 0 8px;font-size:12px;font-weight:640;color:var(--muted);letter-spacing:.6px}
.hide{display:none!important}
#conflict{border-top:1px solid #F0D9B5;background:#FFF7EA;padding:9px 14px}
#conflict .cbar{max-width:920px;margin:0 auto;font-size:12.5px;line-height:1.5;color:#7A5200}
#conflict b{font-weight:650}
#conflict .cbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#conflict .cbtns .btn{height:30px;font-size:12.5px}

/* ---------- toolbar ---------- */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{
  border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 12px;height:36px;
  font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:500;
}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.link{border:0;background:none;color:var(--accent);padding:0 4px;height:auto}
.btn:disabled{opacity:.45}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;min-height:36px;
  width:100%;outline:none;transition:border-color .12s;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(31,78,121,.09)}
.search{position:relative;flex:1;min-width:130px}
.search input{padding-left:30px}
.search::before{content:"";position:absolute;left:10px;top:50%;width:13px;height:13px;margin-top:-7px;
  background:currentColor;color:var(--muted);opacity:.6;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.4'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>") center/contain no-repeat}
select.sel{width:auto;min-width:96px;padding-right:26px}

/* ---------- match card ---------- */
.mlist{display:flex;flex-direction:column;gap:9px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.mc-h{display:flex;align-items:baseline;gap:7px;padding:9px 12px 6px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.mc-h .sq{font-weight:600;color:var(--ink2)}
.mc-h .lg{color:var(--accent);background:var(--accent-weak);border-radius:4px;padding:0 5px;font-size:10.5px;line-height:16px}
.mc-h .lg.q{color:var(--warn);background:#FBF6E8;border:1px solid #F0E4C4}
.mc-h .st{margin-left:auto;white-space:nowrap}
.mc-b{display:flex;align-items:center;gap:10px;padding:0 12px 8px}
.mc-b .tm{font-size:15px;font-weight:620;letter-spacing:.2px;flex:1;min-width:0}
.mc-b .tm.r{text-align:right}
.mc-b .sc{font-size:16px;font-weight:660;letter-spacing:.5px;color:var(--ink);white-space:nowrap;
  background:var(--line2);border-radius:6px;padding:2px 8px;min-width:52px;text-align:center}
.mc-b .sc.no{color:var(--muted);font-weight:400;font-size:12px}
.mc-l{border-top:1px solid var(--line2);padding:4px 0}
.lg-row{display:grid;grid-template-columns:minmax(0,1fr) 44px 64px 74px;gap:6px;padding:4px 12px;font-size:12.5px;align-items:baseline}
.lg-row .bo{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-row .od,.lg-row .sk{text-align:right;color:var(--ink2)}
.lg-row .pn{text-align:right;font-weight:600}
.lg-row.head{font-size:10.5px;color:var(--muted);padding-top:2px;padding-bottom:0}
.mc-f{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line2);flex-wrap:nowrap;overflow:hidden;
  background:#FBFCFB;font-size:11.5px;color:var(--muted)}
.mc-f .sum{font-weight:650;font-size:13px}
.mc-f .sp{flex:1 1 auto;min-width:0}
.mc-f .note-in{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-f .btn.link,.mc-f .sum,.mc-f .num{flex:0 0 auto}
.win{color:var(--win)} .lose{color:var(--lose)} .push{color:var(--push)}
.badge{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid;line-height:15px;white-space:nowrap}
.badge.w{color:var(--win);border-color:#E8C9C3;background:#FCF3F1}
.badge.l{color:var(--lose);border-color:#C6E0D3;background:#F1F8F4}
.badge.p{color:var(--warn);border-color:#EDE0BE;background:#FCF8EC}
.badge.n{color:var(--muted);border-color:var(--line);background:#FAFBFA}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--sh)}
.kpi .k{font-size:11px;color:var(--muted);letter-spacing:.3px}
.kpi .v{font-size:20px;font-weight:660;letter-spacing:-.4px;margin-top:2px;line-height:1.2}
.kpi .d{font-size:11px;color:var(--muted);margin-top:1px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}

/* ---------- chart ---------- */
.chartwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 8px 6px;position:relative}
.chartwrap .ttl{font-size:12px;font-weight:640;color:var(--ink2);padding:0 6px 8px;display:flex;align-items:center;gap:8px}
.chartwrap .ttl .sp{flex:1}
svg.ch{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:#14181D;color:#fff;font-size:11.5px;line-height:1.45;
  padding:6px 9px;border-radius:7px;transform:translate(-50%,-100%);white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5}
.tip.on{opacity:1}

/* ---------- table ---------- */
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2)}
th{font-size:11px;color:var(--muted);font-weight:600;background:#FAFBFA;position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit}
td:first-child{background:var(--card)}
tbody tr:last-child td{border-bottom:0}
tr.tot td{font-weight:660;background:#FAFBFA;border-top:1px solid var(--line)}
tr.tot td:first-child{background:#FAFBFA}
tbody tr.clickable:active{background:var(--accent-weak)}

/* ---------- insight ---------- */
.ins{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:12px 14px;margin-bottom:9px;border-left:3px solid var(--accent)}
.ins.warn,.ins.bad{border-left-color:#9A6B00}

.ins.good{border-left-color:var(--accent)}
.ins h3{margin:0 0 5px;font-size:13.5px;font-weight:640;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ins h3 .tag{font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:0 5px;line-height:15px}
.ins p{margin:0;font-size:13px;color:var(--ink2);line-height:1.55}
.ins .do{margin-top:7px;font-size:12.5px;color:var(--accent);background:var(--accent-weak);
  border-radius:6px;padding:6px 9px;line-height:1.5}
.ins b.hl{font-weight:660}

/* ---------- modal / sheet ---------- */
.mask{position:fixed;inset:0;background:rgba(15,20,26,.42);z-index:100;opacity:0;pointer-events:none;transition:opacity .16s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;background:var(--card);visibility:hidden;
  border-radius:14px 14px 0 0;max-height:92dvh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .2s cubic-bezier(.22,.7,.3,1);
  box-shadow:0 -6px 30px rgba(15,20,26,.16);padding-bottom:env(safe-area-inset-bottom);transition:transform .2s cubic-bezier(.22,.7,.3,1),visibility 0s .2s}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .2s cubic-bezier(.22,.7,.3,1),visibility 0s 0s}
.sheet-h{display:flex;align-items:center;gap:10px;padding:13px 14px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:15px;font-weight:650}
.sheet-h .sp{flex:1}
.sheet-b{overflow-y:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:9px;background:#FBFCFB}
.sheet-f .btn{flex:1;justify-content:center;height:42px}
@media(min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-46%) scale(.98);
    width:min(720px,calc(100vw - 40px));max-height:86dvh;border-radius:12px;opacity:0;transition:opacity .16s,transform .16s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;visibility:visible}
}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.fg.one{grid-template-columns:1fr}
.fg label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
@media(max-width:420px){.fg{grid-template-columns:1fr}}

.lgs{margin-top:4px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lg-edit{border-bottom:1px solid var(--line2);padding:9px 10px;background:#FDFDFC}
.lg-edit:last-child{border-bottom:0}
.lg-edit .r1{display:grid;grid-template-columns:1fr 58px 76px;gap:6px}
.lg-edit .r2{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px;align-items:center;font-size:11.5px}
.lg-edit .auto{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:5px;min-width:0}
.lg-edit .auto .z{color:var(--ink2);font-weight:600}
.lg-edit .del{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.lg-edit .del:hover{background:#F4F1F0;color:var(--win)}
.om{font-size:11.5px;padding:2px 0;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.om b{color:var(--ink2);font-weight:600}

.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty h3{margin:0 0 6px;font-size:14.5px;color:var(--ink2);font-weight:600}
.empty p{margin:0 0 14px;font-size:12.5px}
.empty .btn{margin:0 auto}

.note{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0}
.note.warn{color:var(--warn)}
.list-tool{display:flex;flex-direction:column;gap:7px}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:9px;font-size:13px}
.row .sp{flex:1 1 auto;min-width:0}
.row>div:first-child{flex:1 1 auto;min-width:0}
.row .btn.link{flex:0 0 auto;white-space:nowrap}
.row .k{color:var(--muted);font-size:12px}
.row.tap:active{background:#FAFBFA}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px;font-size:12.5px;color:var(--muted)}
.pager .btn{min-width:64px;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:#14181D;color:#fff;font-size:12.5px;padding:9px 15px;border-radius:9px;opacity:0;
  pointer-events:none;transition:opacity .18s,transform .18s;z-index:300;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.dirty{color:var(--warn)}
.ok{color:var(--lose)}
.hr{height:1px;background:var(--line);margin:14px 0}
details summary{cursor:pointer;font-size:12.5px;color:var(--accent);list-style:none;padding:2px 0}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";font-size:10px}
details[open] summary::before{content:"▾ "}
/* ---- 宽屏：页签收窄、列表行更宽松 ---- */
@media(min-width:760px){
  nav.tabs{gap:6px}
  nav.tabs button{flex:0 1 auto;min-width:92px;padding:8px 22px}
  .lg-row{grid-template-columns:minmax(0,1fr) 62px 92px 104px}
  .hd h1{font-size:17px}
}
/* ---- 窄屏：报表只留最关键的列，不横向硬挤 ---- */
@media(max-width:700px){
  .tbwrap table{min-width:0}
  .c-sm-hide{display:none}
  .tbwrap th,.tbwrap td{padding:7px 6px}
}
/* ---- 手机桌面 App（PWA）体感：安全区、触控尺寸、禁用系统橡皮筋 ---- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none}
header{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
@media(max-width:700px){
  /* 手指点的东西最小 44px，避免点不中 */
  .btn{min-height:44px}
  .btn.sm{min-height:38px}
  nav.tabs button{min-height:44px}
  input,select,.sel{min-height:42px}
  .search{height:auto;min-height:44px}
  .search input{min-height:44px}
  .row.tap{min-height:52px}
  .mc{scroll-margin-top:120px}
  .mc-actions .btn{min-height:40px}
  .pk-row{min-height:56px}
}
</style>
</head>
<body>

<header>
  <div class="hd">
    <div>
      <h1>足球竞彩台</h1>
      <div class="sub" id="subline">载入中…</div>
    </div>
    <div class="sp"></div>
  </div>
  <div class="hd3">
    <div><div class="k">买球盈亏</div><div class="v num" id="hGross">0</div></div>
    <div><div class="k">料单总价</div><div class="v num" id="hCost">0</div></div>
    <div><div class="k">加上料单的盈亏</div><div class="v num" id="hNet2">0</div></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-t="entry" class="on">录入</button>
    <button data-t="curve">曲线</button>
    <button data-t="sum">总结</button>
    <button data-t="adv">建议</button>
    <button data-t="data">数据</button>
  </nav>
  <div id="conflict" class="hide"></div>
</header>

<main>
  <section id="v-entry"></section>
  <section id="v-curve" class="hide"></section>
  <section id="v-sum" class="hide"></section>
  <section id="v-adv" class="hide"></section>
  <section id="v-data" class="hide"></section>
</main>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-h">
    <h2 id="sheetT">编辑</h2>
    <div class="sp"></div>

<!-- ============ 初始数据（由原表导入生成） ============ -->
<script id="seed">
window.SEED = {"version":2,"matches":[],"costs":[],"settings":{}};
</script>

<!-- ============ 结算引擎（纯函数，可被 node 单独抽取测试） ============ -->
<script id="engine">
/*ENGINE-START*/
var Engine = (function () {
  "use strict";

  function parseScore(s) {
    if (!s) return null;
    s = String(s).replace(/：/g, ":").replace(/\s/g, "");
    var m = /^(\d+):(\d+)$/.exec(s);
    if (!m) return null;
    return [parseInt(m[1], 10), parseInt(m[2], 10)];
  }

  // 四分盘拆成两半：-1.75 -> [-1.5,-2.0]
  function splitQuarter(h) {
    var x = h * 4;
    var r = Math.round(x);
    if (Math.abs(x - r) > 1e-9) return [h];
    if (r % 2 === 0) return [h];
    return [(r - 1) / 4, (r + 1) / 4];
  }

  function combine(res) {
    var n = res.length, s = 0;
    for (var i = 0; i < n; i++) s += res[i];
    if (n === 1) return { 1: "W", 0: "P", "-1": "L" }[String(res[0])];
    if (res[0] === 1 && res[1] === 1) return "W";
    if ((res[0] === 1 && res[1] === 0) || (res[0] === 0 && res[1] === 1)) return "HW";
    if (res[0] === 0 && res[1] === 0) return "P";
    if ((res[0] === -1 && res[1] === 0) || (res[0] === 0 && res[1] === -1)) return "HL";
    if (res[0] === -1 && res[1] === -1) return "L";
    return null;
  }

  function settleAsian(diff) {           // diff = 让球后净胜
    if (Math.abs(diff) < 1e-9) return 0;
    return diff > 0 ? 1 : -1;
  }

  function settleHandicap(sf, sa, line) {
    var parts = splitQuarter(line), out = [];
    for (var i = 0; i < parts.length; i++) out.push(settleAsian(sf + parts[i] - sa));
    return combine(out);
  }

  function settleOU(total, line, isOver) {
    var parts = splitQuarter(line), out = [];
    for (var i = 0; i < parts.length; i++) {
      var d = isOver ? total - parts[i] : parts[i] - total;
      out.push(settleAsian(d));
    }
    return combine(out);
  }

  // 结算码 -> 净盈亏
  function payout(code, odds, stake) {
    if (code == null) return null;
    odds = Number(odds); stake = Number(stake);
    if (!isFinite(odds) || !isFinite(stake)) return null;
    switch (code) {
      case "W": return odds * stake;
      case "HW": return odds * stake / 2;
      case "P": return 0;
      case "HL": return -stake / 2;
      case "L": return -stake;
      case "V": return 0;                 // 取消/作废
      default: return null;
    }
  }

  var CODE_CN = { W: "全赢", HW: "半赢", P: "走水", HL: "半输", L: "全输", V: "取消" };

  function normTxt(s) {
    return String(s || "")
      .replace(/＞/g, ">").replace(/＜/g, "<")
      .replace(/ＶＳ|VS|vs/g, "vs")
      .replace(/\s+/g, "");
  }

  /**
   * 解析下注内容 -> {kind, team, line, over, ...}
   * 返回 null 表示无法自动判定
   */
  function parseBet(bet, home, away) {
    var raw0 = String(bet || "");
    var half = false;
    var t0 = normTxt(raw0);
    // 「半场」盘用中场比分结算：先把「半场/上半场」这类词摘掉，其余按正常玩法解析，再打上 half 标记
    if (t0 && t0.indexOf("半场") >= 0 && t0.indexOf("半全场") < 0) {
      half = true;
      raw0 = raw0.replace(/上半场/g, "").replace(/半场/g, "");
    }
    var p = parseBetCore(raw0, home, away);
    if (p && half && p.kind !== "na" && p.kind !== "htft") p.half = true;
    return p;
  }

  function parseBetCore(bet, home, away) {
    var raw = String(bet || "");
    var t = normTxt(raw);
    if (!t) return null;

    if (t.indexOf("波胆") >= 0) {
      var mm = /(\d+):(\d+)/.exec(t);
      return mm ? { kind: "cs", h: +mm[1], a: +mm[2] } : { kind: "na" };
    }
    if (t.indexOf("总进球数") >= 0) {
      var r = /(\d+)-(\d+)/.exec(t);
      if (r) return { kind: "range", lo: +r[1], hi: +r[2] };
      var p = /(\d+)\+/.exec(t);
      if (p) return { kind: "range", lo: +p[1], hi: 99 };
      return { kind: "na" };
    }
    if (t.indexOf("双方都进球") >= 0) {
      return { kind: "btts", no: t.indexOf("不是") >= 0 };
    }
    if (t.indexOf("全场和局") >= 0) return { kind: "draw" };
    if (/和局\//.test(t) || /\/和局/.test(t)) return { kind: "htft" };   // 半全场需中场比分
    if (t.indexOf("开场15分钟") >= 0) return { kind: "na" };
    // 角球 / 黄牌：靠额外记录的角球数、黄牌数结算
    if (t.indexOf("角球") >= 0 || /黄牌|红牌/.test(t)) {
      var src = t.indexOf("角球") >= 0 ? "corners" : "cards";
      var q = /＞|>|大/.test(t) ? true : (/＜|<|小/.test(t) ? false : null);
      var ln = /(\d+(?:\.\d+)?(?:\/\d+)?)/.exec(t);
      if (!ln || q === null) return { kind: "na" };
      return { kind: "ou", line: ln[1], over: q, src: src };
    }

    // 找出下注对应球队（最长匹配）
    var team = null, isHome = null;
    var cands = [[home, true], [away, false]];
    var best = -1;
    for (var i = 0; i < cands.length; i++) {
      var nm = cands[i][0];
      if (!nm) continue;
      if (t.indexOf(nm) === 0 && nm.length > best) { team = nm; isHome = cands[i][1]; best = nm.length; }
    }
    var rest = team ? t.slice(team.length) : t;

    if (t.indexOf("独赢") >= 0) return { kind: "ml", isHome: isHome, team: team };

    // 球队进球数玩法： XX进球数>2.5
    if (/进球数/.test(t) && /[<>]/.test(t)) {
      var g = /([<>])(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?/.exec(t);
      if (g) {
        var line = g[3] ? (+g[2] + +g[3]) / 2 : +g[2];
        return { kind: "tgoals", isHome: isHome, over: g[1] === ">", line: line };
      }
      return { kind: "na" };
    }

    // 大小球
    if (/[<>]/.test(rest) || (t.indexOf("全场") >= 0 && /[<>]/.test(t))) {
      var m2 = /([<>])(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?/.exec(t);
      if (m2) {
        var L = m2[3] ? (+m2[2] + +m2[3]) / 2 : +m2[2];
        return { kind: "ou", over: m2[1] === ">", line: L };
      }
      return { kind: "na" };
    }

    // 让球（含 0 / +1 / -1.5/2）
    if (team) {
      var h = /([+-]?)(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?\s*$/.exec(rest);
      if (h) {
        var sgn = h[1] === "-" ? -1 : 1;
        var base = +h[2];
        var line2;
        if (h[3] != null && h[3] !== "") line2 = sgn * ((base + (+h[3])) / 2);
        else line2 = sgn * base;
        return { kind: "ah", isHome: isHome, team: team, line: line2 };
      }
      if (rest === "0" || rest === "") return { kind: "ah", isHome: isHome, team: team, line: 0 };
    }
    return { kind: "na" };
  }

  /**
   * 自动结算一条注单
   * 返回 {code, pnl, why} 或 {code:null, why:"需要人工"}
   */
  function autoSettle(match, leg) {
    var sc = parseScore(match.score);
    if (!sc) return { code: null, why: "无赛果" };
    var p = parseBet(leg.bet, match.home, match.away);
    if (!p || p.kind === "na") return { code: null, why: "玩法需人工" };
    if (p.kind === "htft") return { code: null, why: "半全场需人工" };
    var hg = sc[0], ag = sc[1], code = null;
    // 半场盘改用中场比分
    if (p.half) {
      var hs = parseScore(match.ht);
      if (!hs) return { code: null, why: "需半场比分" };
      hg = hs[0]; ag = hs[1];
    }
    // 滚球（只对让球生效）：让球盘按下注那一刻的比分报，只算「下注之后剩余的比赛」。
    // 备注里写「滚球2:1时下单」，就以 2:1 为基准，把之后的进球当成一场新比赛。
    var lv = /滚球\s*(\d+)\s*[:：]\s*(\d+)\s*时/.exec(
      String(leg.note || "") + " " + String(match.note || ""));
    var h0 = 0, a0 = 0, live = false;
    if (lv) {
      h0 = parseInt(lv[1], 10); a0 = parseInt(lv[2], 10);
      live = true;
      // 基准比分不能大于最终比分，否则数据有矛盾，退回按全场结算
      if (h0 > hg || a0 > ag) { h0 = 0; a0 = 0; live = false; }
    }
    var rh = hg - h0, ra = ag - a0;    // 滚球：剩余比赛的比分
    switch (p.kind) {
      case "cs":
        code = (hg === p.h && ag === p.a) ? "W" : "L"; break;
      case "range": {
        var tot = hg + ag;
        code = (tot >= p.lo && tot <= p.hi) ? "W" : "L"; break;
      }
      case "btts": {
        var both = hg > 0 && ag > 0;
        code = (both !== p.no) ? "W" : "L"; break;
      }
      case "draw":
        code = (hg === ag) ? "W" : "L"; break;
      case "ml": {
        if (p.isHome == null) return { code: null, why: "球队未对上" };
        var mh = hg, ma = ag;
        code = p.isHome ? (mh > ma ? "W" : (mh === ma ? "P" : "L"))
                        : (ma > mh ? "W" : (mh === ma ? "P" : "L"));
        break;
      }
      case "ou":
        if (p.src) {
          var cv = p.src === "corners" ? match.corners : match.cards;
          if (cv == null || cv === "") return { code: null, why: p.src === "corners" ? "需角球数" : "需黄牌数" };
          code = settleOU(Number(cv), p.line, p.over); break;
        }
        code = settleOU(hg + ag, p.line, p.over); break;
      case "tgoals":
        if (p.isHome == null) return { code: null, why: "球队未对上" };
        code = settleOU(p.isHome ? hg : ag, p.line, p.over); break;
      case "ah": {
        if (p.isHome == null) return { code: null, why: "球队未对上" };
        var sf = p.isHome ? (live ? rh : hg) : (live ? ra : ag);
        var sa = p.isHome ? (live ? ra : ag) : (live ? rh : hg);
        code = settleHandicap(sf, sa, p.line); break;
      }
      default: return { code: null, why: "玩法需人工" };
    }
    if (code == null) return { code: null, why: "玩法需人工" };
    return { code: code, pnl: payout(code, leg.odds, leg.stake), why: CODE_CN[code] || "" };
  }

  // 玩法归类（用于统计）
  function marketOf(bet) {
    var b = String(bet || "");
    if (b.indexOf("波胆") >= 0) return "波胆";
    if (b.indexOf("总进球数") >= 0) return "总进球数";
    if (b.indexOf("开场15分钟") >= 0) return "开场15分钟";
    if (b.indexOf("半场") >= 0) return "半场";
    if (b.indexOf("双方都进球") >= 0) return "双方进球";
    if (/和局\//.test(b) || /\/和局/.test(b)) return "半全场";
    if (b.indexOf("全场和局") >= 0) return "全场和局";
    if (b.indexOf("独赢") >= 0) return "独赢";
    if (b.indexOf("进球数") >= 0) return "球队进球数";
    if (/[＞＜<>]/.test(b)) return "大小球";
    return "让球";
  }

  function isLive(note) { return /滚球/.test(String(note || "")); }

  // 有效盈亏：手工锁定 > 原表记录 > 规则自动结算
  // 这样导入的历史数据保持原样，只有新录入 / 清空过盈亏的注单才走规则
  function legPnl(match, leg) {
    if (leg.manual != null && leg.manual !== "") {
      var v = Number(leg.manual);
      if (isFinite(v)) return { pnl: v, src: "manual" };
    }
    if (leg.pnl != null && leg.pnl !== "") {
      var r0 = Number(leg.pnl);
      if (isFinite(r0)) return { pnl: r0, src: "recorded" };
    }
    var a = autoSettle(match, leg);
    if (a.pnl != null) return { pnl: a.pnl, src: "auto", code: a.code };
    return { pnl: 0, src: "none" };
  }

  // ---------- 统计 ----------
  function isoWeek(dstr) {
    var d = new Date(dstr + "T00:00:00");
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = (t.getUTCDay() + 6) % 7;        // 周一=0
    t.setUTCDate(t.getUTCDate() - day + 3);
    var firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    var fday = (firstThu.getUTCDay() + 6) % 7;
    firstThu.setUTCDate(firstThu.getUTCDate() - fday + 3);
    var wk = 1 + Math.round((t - firstThu) / 604800000);
    return t.getUTCFullYear() + "-W" + (wk < 10 ? "0" + wk : wk);
  }
  function weekStart(dstr) {
    var d = new Date(dstr + "T00:00:00");
    var day = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - day);
    return ymd(d);
  }
  function ymd(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // 逐笔展开
  function flatten(matches) {
    var rows = [];
    for (var i = 0; i < matches.length; i++) {
      var m = matches[i];
      var mp = 0, any = false;
      for (var j = 0; j < m.legs.length; j++) {
        var lg = m.legs[j];
        var r = legPnl(m, lg);
        var stake = Number(lg.stake) || 0;
        rows.push({
          match: m, leg: lg, pnl: r.pnl, src: r.src, code: r.code,
          stake: stake, odds: Number(lg.odds) || 0,
          market: marketOf(lg.bet), live: isLive(m.note) || isLive(lg.note),
          league: m.league || "", date: m.date || "", settled: !!m.settled
        });
        mp += r.pnl; any = true;
      }
      m._pnl = mp;
      m._legs = m.legs.length;
    }
    return rows;
  }

  function agg(rows) {
    var o = { n: rows.length, stake: 0, pnl: 0, win: 0, lose: 0, push: 0, half: 0 };
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      o.stake += r.stake; o.pnl += r.pnl;
      if (r.pnl > 0.005) o.win++;
      else if (r.pnl < -0.005) o.lose++;
      else o.push++;
    }
    o.roi = o.stake ? o.pnl / o.stake * 100 : 0;
    return o;
  }

  function groupBy(rows, keyFn) {
    var map = {}, order = [];
    for (var i = 0; i < rows.length; i++) {
      var k = keyFn(rows[i]);
      if (!map[k]) { map[k] = []; order.push(k); }
      map[k].push(rows[i]);
    }
    return order.map(function (k) { return { key: k, rows: map[k], ...agg(map[k]) }; });
  }

  return {
    parseScore: parseScore, parseBet: parseBet, autoSettle: autoSettle,
    payout: payout, CODE_CN: CODE_CN, marketOf: marketOf, isLive: isLive,
    legPnl: legPnl, flatten: flatten, agg: agg, groupBy: groupBy,
    isoWeek: isoWeek, weekStart: weekStart, ymd: ymd, pad: pad
  };
})();
if (typeof module !== "undefined" && module.exports) module.exports = Engine;
/*ENGINE-END*/
</script>

<!-- ============ 数据层 ============ -->
<script>
var Store = (function () {
  var KEY = "ftbet_v2";
  var state = { data: null, mode: "local", dirty: false, saving: false, lastSave: null, err: null, info: null };

  function seed() { return window.SEED || { version: 2, matches: [], costs: [], settings: {} }; }

  function normalize(d) {
    d = d || {};
    d.version = d.version || 2;
    d.matches = Array.isArray(d.matches) ? d.matches : [];
    d.settings = d.settings || {};
    var mx = 0;
    d.matches.forEach(function (m) {
      m.id = m.id || ("m" + Math.random().toString(36).slice(2, 9));
      m.legs = Array.isArray(m.legs) ? m.legs : [];
      m.legs.forEach(function (l) { l.id = l.id || ("b" + Math.random().toString(36).slice(2, 9)); });
      if (m.seq > mx) mx = m.seq || 0;
    });
    d.matches.sort(function (a, b) {
      return (a.date || "").localeCompare(b.date || "") || (a.seq || 0) - (b.seq || 0);
    });
    d._maxSeq = mx;
    return d;
  }

  function load() {
    return fetch("/api/ping", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (j && j.ok) {
          state.mode = "server";
          state.info = j;
          return fetch("/api/data", { cache: "no-store" })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              var out = (d && Array.isArray(d.matches) && d.matches.length) ? normalize(d) : normalize(seed());
              return fetch("/api/rev", { cache: "no-store" })
                .then(function (r) { return r.json(); })
                .then(function (v) { state.rev = v && v.rev; return out; })
                .catch(function () { return out; });
            });
        }
        throw new Error("no server");
      })
      .catch(function () {
        state.mode = "local";
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) return normalize(JSON.parse(raw));
        } catch (e) {}
        return normalize(seed());
      });
  }

  var timer = null;
  // 落盘/导出用的干净副本：剥掉页面内部用的 _ 前缀临时字段
  function plain(d) {
    var out = {
      version: d.version || 2,
      updatedAt: new Date().toISOString().slice(0, 19),
      settings: d.settings || {},
      deleted: d.deleted || {},
      tips: d.tips || [],
      matches: [],
      costs: d.costs || []
    };
    (d.matches || []).forEach(function (m) {
      var o = {};
      for (var k in m) if (k.charAt(0) !== "_") o[k] = m[k];
      o.legs = (m.legs || []).map(function (l) {
        var lo = {};
        for (var kk in l) if (kk.charAt(0) !== "_") lo[kk] = l[kk];
        return lo;
      });
      out.matches.push(o);
    });
    return out;
  }
  function save(now) {
    stampChanged();
    state.dirty = true;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { flush(); }, now ? 0 : 700);
  }
  // 给「本次真正改动过」的场次打时间戳，供多设备合并时判断谁更新
  var lastSnap = {};
  function stampChanged() {
    if (!state.data || !state.data.matches) return;
    var t = Date.now(), seen = {};
    state.data.matches.forEach(function (m) {
      if (!m.id) return;
      seen[m.id] = 1;
      var s = JSON.stringify([m.date, m.time, m.league, m.home, m.away, m.score, m.ht,
        m.corners, m.cards, m.note, m.tipCost, m.settled, m.legs]);
      if (lastSnap[m.id] !== undefined && lastSnap[m.id] !== s) m.upd = t;
      else if (lastSnap[m.id] === undefined) m.upd = m.upd || t;
      lastSnap[m.id] = s;
    });
    Object.keys(lastSnap).forEach(function (id) {
      if (!seen[id]) { state.data.deleted = state.data.deleted || {}; state.data.deleted[id] = t; }
    });
    // 清掉已经从 match 列表消失的键
    for (var k in lastSnap) if (!seen[k]) delete lastSnap[k];
  }
  function flush() {
    if (!state.data) return Promise.resolve();
    state.saving = true;
    var payload = JSON.stringify(plain(state.data));
    if (state.mode === "server") {
      return fetch("/api/data", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Base-Rev": state.rev || "" },
        body: payload
      })
        .then(function (r) {
          if (r.status === 409) {
            return r.json().then(function (j) {
              var e = new Error("conflict");
              e.conflict = j || {};
              throw e;
            });
          }
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (j) {
          state.dirty = false; state.saving = false; state.err = null;
          state.rev = (j && j.rev) || state.rev;
          state.lastSave = new Date();
          UI.syncSave();
        })
        .catch(function (e) {
          state.saving = false;
          if (e && e.conflict) {
            // 别的设备改过了：绝不覆盖，交给用户选
            state.conflict = true;
            state.conflictRev = e.conflict.rev || null;
            state.err = "另一台设备改过数据，本次保存被拦下";
          } else {
            state.err = e.message;
          }
          try { localStorage.setItem(KEY, payload); } catch (x) {}
          UI.syncSave();
        });
    }
    try { localStorage.setItem(KEY, payload); } catch (e) { state.err = "本地存储已满"; }
    state.dirty = false; state.lastSave = new Date(); state.saving = false;
    UI.syncSave();
    return Promise.resolve();
  }

  // 强制覆盖：拿服务端当前版本号当基底，再写一次
  function forceFlush() {
    return fetch("/api/rev", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        state.rev = (j && j.rev) || state.rev;
        state.conflict = false;
        return flush();
      });
  }

  // 以磁盘为准重新载入
  function pull() {
    return fetch("/api/data", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        state.data = normalize(d);
        return fetch("/api/rev", { cache: "no-store" }).then(function (r) { return r.json(); })
          .then(function (j) { state.rev = j && j.rev; })
          .catch(function () {});
      })
      .then(function () {
        state.conflict = false; state.dirty = false; state.err = null;
      });
  }

  return {
    get data() { return state.data; }, set data(v) { state.data = v; },
    get mode() { return state.mode; }, get state() { return state; },
    load: load, save: save, flush: flush, plain: plain,
    forceFlush: forceFlush, pull: pull,
    normalize: normalize, seed: seed,
    // 序号每次按当前最大值现算，避免缓存落后导致两台设备撞号
    nextSeq: function () {
      var mx = 0;
      (state.data.matches || []).forEach(function (m) {
        var s = Number(m.seq) || 0;
        if (s > mx) mx = s;
      });
      return mx + 1;
    }
  };
})();
</script>

    '<fill><patternFill patternType="solid"><fgColor rgb="FFFFFF00"/><bgColor indexed="64"/></patternFill></fill>' +

    '</fills>' +

    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
    '<cellXfs count="14">' +
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
    '<xf numFmtId="0" fontId="2" fillId="5" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="49" fontId="1" fillId="0" borderId="1" xfId="0" applyNumberFormat="1" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="3" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="4" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="1" xfId="0" applyFont="1" applyBorder="1"/>' +

    '<xf numFmtId="0" fontId="1" fillId="3" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf>' +

<!-- ============ 界面 ============ -->
<script>
var UI = (function () {
  "use strict";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var view = "entry";
  var filters = { q: "", scope: "all", league: "" };
  var page = 1, PER = 40;
  var editing = null;
  var sumMode = "day";
  var curveOpt = { withCost: true, metric: "pnl" };

  // ---------- util ----------
  function fmt(n, d) {
    if (n == null || !isFinite(n)) return "—";
    d = d == null ? (Math.abs(n % 1) > 0.004 ? 2 : 0) : d;
    var s = Math.abs(n).toFixed(d);
    var p = s.split(".");
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (n < -0.004 ? "-" : "") + p.join(".");
  }
  function money(n) { return n == null ? "—" : (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n)); }
  function cls(n) { return n > 0.004 ? "win" : n < -0.004 ? "lose" : "push"; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  var WD = ["日", "一", "二", "三", "四", "五", "六"];
  function dow(d) {
    if (!d) return "";
    var x = new Date(d + "T00:00:00");
    return isNaN(x) ? "" : "周" + WD[x.getDay()];
  }
  function md(d) { if (!d) return ""; var p = d.split("-"); return (+p[1]) + "/" + (+p[2]); }
  function toast(msg, ms) {
    var t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove("on"); }, ms || 1900);
  }

  // ---------- 撤回（快照栈，任何改动都能退一步） ----------
  var undoStack = [], undoPending = null, UNDO_MAX = 40;
  function snap() { try { return JSON.stringify(Store.plain(Store.data)); } catch (e) { return null; } }
  // 开始一次可撤回的操作：先把当前状态拍下来
  function undoBegin() { if (undoPending == null) undoPending = snap(); }
  // 操作结束：内容真变了才入栈
  function undoCommit(label) {
    if (undoPending == null) return;
    var now = snap();
    if (now && now !== undoPending) {
      undoStack.push({ label: label || "操作", json: undoPending });
      if (undoStack.length > UNDO_MAX) undoStack.shift();
    }
    undoPending = null;
    renderUndoBtn();
  }
  function undoDrop() { undoPending = null; }
  function undoRun() {
    var s = undoStack.pop();
    if (!s) { toast("没有可撤回的操作了"); renderUndoBtn(); return; }
    try {
      Store.data = Store.normalize(JSON.parse(s.json));
      Store.save(true);
      closeSheet();
      render();
      renderUndoBtn();
      toast("已撤回：" + s.label);
    } catch (e) { toast("撤回失败：" + e.message); }
  }
  function renderUndoBtn() {
    var b = $("#btnUndo");
    if (!b) return;
    b.disabled = !undoStack.length;
    b.style.opacity = undoStack.length ? "1" : ".42";
    b.textContent = undoStack.length ? "↶ 撤回" : "↶ 无可撤回";
    b.title = undoStack.length ? ("撤回：" + undoStack[undoStack.length - 1].label) : "";
  }

  // ---------- 多设备自动同步（电脑当同步端，不依赖任何云服务） ----------
  // 合并规则：同一 id 取 upd 更新的那条；删除用 deleted[id]=时间戳 做墓碑；
  // 合并完再写回，冲突时重取一次再合并。
  var SYNC = { busy: false, last: null, msg: "未开启", err: "" };

  function syncUrl() {
    var u = (D().settings && D().settings.syncUrl) || "";
    return String(u).replace(/\/+$/, "");
  }

  function mergeRemote(local, remote) {
    var out = JSON.parse(JSON.stringify(local));
    out.deleted = out.deleted || {};
    var lm = {}, rm = {};
    (local.matches || []).forEach(function (m) { if (m.id) lm[m.id] = m; });
    (remote.matches || []).forEach(function (m) { if (m.id) rm[m.id] = m; });
    var del = {};
    Object.keys(local.deleted || {}).forEach(function (k) { del[k] = Math.max(del[k] || 0, local.deleted[k] || 0); });
    Object.keys(remote.deleted || {}).forEach(function (k) { del[k] = Math.max(del[k] || 0, remote.deleted[k] || 0); });

    var ids = {}, added = 0, updated = 0, removed = 0, kept = 0;
    Object.keys(lm).forEach(function (k) { ids[k] = 1; });
    Object.keys(rm).forEach(function (k) { ids[k] = 1; });
    var merged = [];
    Object.keys(ids).forEach(function (id) {
      var a = lm[id], b = rm[id];
      if (!a) { merged.push(b); added++; return; }
      if (!b) { merged.push(a); kept++; return; }
      var ua = a.upd || 0, ub = b.upd || 0;
      if (ub > ua) { merged.push(b); updated++; } else { merged.push(a); kept++; }
    });
    // 墓碑生效：删除时间晚于该场最后修改时间的，整条移除
    merged = merged.filter(function (m) {
      var d = del[m.id];
      if (d && d >= (m.upd || 0)) { removed++; return false; }
      return true;
    });
    out.matches = merged;
    out.deleted = del;
    out.settings = local.settings || remote.settings || {};
    // 料单也要合并！否则本地旧料单会把云端的新料单盖回去（表现为"已同步但内容没变"）
    var tm = {};
    (local.tips || []).forEach(function (t) { if (t && t.id) tm[t.id] = t; });
    (remote.tips || []).forEach(function (t) { if (t && t.id) tm[t.id] = t; });   // 冲突时以云端为准
    out.tips = Object.keys(tm).map(function (k) { return tm[k]; });
    return { data: out, added: added, updated: updated, removed: removed, kept: kept,
             tips: out.tips.length };
  }

  function syncNow(silent) {
    var base = syncUrl();
    if (!base) { SYNC.msg = "未设置同步地址"; renderSyncRow(); return Promise.resolve(); }
    if (SYNC.busy) return Promise.resolve();
    SYNC.busy = true; SYNC.err = ""; SYNC.msg = "同步中…"; renderSyncRow();
    var rev = "";
    return fetch(base + "/api/rev", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { rev = (j && j.rev) || ""; return fetch(base + "/api/data", { cache: "no-store" }); })
      .then(function (r) { return r.json(); })
      .then(function (remote) {
        var res = mergeRemote(Store.plain(D()), remote);
        Store.data = Store.normalize(res.data);
        Store.save(true);
        return { res: res, rev: rev };
      })
      .then(function (x) {
        return fetch("" + base + "/api/rev", { cache: "no-store" }).then(function (r) { return r.json(); })
          .then(function (j) {
            return fetch(base + "/api/data", {
              method: "PUT",
              headers: { "Content-Type": "application/json", "X-Base-Rev": (j && j.rev) || "" },
              body: JSON.stringify(Store.plain(D()))
            });
          })
          .then(function (r) {
            if (r.status === 409) throw new Error("rev-conflict");
            if (!r.ok) throw new Error("HTTP " + r.status);
            var y = x.res;
            SYNC.last = new Date();
            SYNC.msg = "已同步（新增 " + y.added + "、更新 " + y.updated + "、删除 " + y.removed + "）";
            SYNC.busy = false;
            renderSyncRow(); render();
            if (!silent) toast(SYNC.msg);
          });
      })
      .catch(function (e) {
        SYNC.busy = false;
        SYNC.err = e.message === "rev-conflict" ? "对方刚改过，再点一次同步即可" : ("连不上：" + e.message);
        SYNC.msg = "同步失败";
        renderSyncRow();
        if (!silent) toast(SYNC.msg + " · " + SYNC.err);
      });
  }

  function renderSyncRow() {
    var el = $("#syncInfo");
    if (!el) return;
    var s = (D().settings && D().settings.syncUrl) || "";
    el.innerHTML = '<div class="note" style="margin:2px 0 6px">同步地址：<b>' + (s ? esc(s) : "（未设置）") + "</b><br>" +
      "状态：" + esc(SYNC.msg) + (SYNC.err ? '<br><span style="color:var(--win)">' + esc(SYNC.err) + "</span>" : "") +
      (SYNC.last ? "<br>上次成功：" + SYNC.last.toLocaleTimeString() : "") +
      (s && !SYNC.busy ? '<br><button class="btn sm" id="syncNowBtn" style="margin-top:6px">立即同步</button>' : "") +
      "</div>";
    var b = $("#syncNowBtn");
    if (b) b.onclick = function () { syncNow(false); };
  }

  // ---------- Gitee 云同步（HTTPS，手机电脑都能连，不依赖同一 wifi） ----------
  var GSYNC = { busy: false, last: null, msg: "未配置" };
  function gconf() {
    var s = D().settings || {};
    return { owner: s.gOwner || "", repo: s.gRepo || "", token: s.gToken || "", path: "data.json" };
  }
  function b64decode(s) {
    var bin = atob(String(s).replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }
  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function gapi(method, path, form) {
    var url = "https://gitee.com/api/v5" + path;
    var opt = { method: method, cache: "no-store" };
    if (form) {
      var body = [];
      Object.keys(form).forEach(function (k) {
        body.push(encodeURIComponent(k) + "=" + encodeURIComponent(form[k]));
      });
      opt.headers = { "Content-Type": "application/x-www-form-urlencoded" };
      opt.body = body.join("&");
    }
    return fetch(url, opt).then(function (r) {
      return r.text().then(function (t) {
        var j = null;
        try { j = JSON.parse(t); } catch (e) {}
        return { status: r.status, ok: r.ok, data: j };
      });
    });
  }
  function syncGitee(silent) {
    var c = gconf();
    if (!c.token || !c.owner || !c.repo) {
      GSYNC.msg = "还没填仓库和令牌";
      renderGitee(); if (!silent) toast(GSYNC.msg);
      return Promise.resolve();
    }
    if (GSYNC.busy) return Promise.resolve();
    GSYNC.busy = true; GSYNC.msg = "同步中…"; renderGitee();
    var base = "/repos/" + encodeURIComponent(c.owner) + "/" + encodeURIComponent(c.repo) + "/contents/" + c.path;
    var q = "?access_token=" + encodeURIComponent(c.token) + "&ref=master&t=" + Date.now();
    return gapi("GET", base + q)
      .then(function (r) {
        if (r.status === 404) return { remote: null, sha: null };
        if (!r.ok || !r.data || !r.data.content) throw new Error("读取失败(" + r.status + ")");
        var txt = b64decode(r.data.content);
        return { remote: JSON.parse(txt), sha: r.data.sha };
      })
      .then(function (x) {
        var local = Store.plain(D());
        var res = null;
        if (x.remote) {
          res = mergeRemote(local, x.remote);
          Store.data = Store.normalize(res.data);
          ensureSeqUnique();
          Store.save(true);
        }
        var payload = Store.plain(D());
        var form = { access_token: c.token, content: b64encode(JSON.stringify(payload)),
                     message: "sync " + new Date().toISOString().slice(0, 19) };
        if (x.sha) form.sha = x.sha;
        return gapi(x.sha ? "PUT" : "POST", base, form).then(function (w) {
          if (!w.ok) throw new Error("写入失败(" + w.status + ")");
          GSYNC.last = new Date();
          GSYNC.msg = res
            ? ("已同步（新增 " + res.added + "、更新 " + res.updated + "、删除 " + res.removed + "）")
            : "已上传本机数据（首次）";
          GSYNC.busy = false;
          renderGitee(); render();
          if (!silent) toast(GSYNC.msg);
        });
      })
      .catch(function (e) {
        GSYNC.busy = false;
        GSYNC.msg = "同步失败：" + e.message;
        renderGitee();
        if (!silent) toast(GSYNC.msg);
      });
  }
  function renderGitee() {
    var el = $("#gInfo");
    if (!el) return;
    var c = gconf();
    el.innerHTML = '<div class="note" style="margin:2px 0 6px">' +
      "仓库：<b>" + (c.owner ? esc(c.owner + "/" + c.repo) : "（未填）") + "</b>　" +
      "令牌：" + (c.token ? "已保存" : "（未填）") +
      "<br>状态：" + esc(GSYNC.msg) +
      (GSYNC.last ? "<br>上次成功：" + GSYNC.last.toLocaleTimeString() : "") +
      "</div>";
  }

  // ---------- 料单（一张料单可挂多场比赛，成本只算一次） ----------
  // 数据模型：data.tips = [{id, name, cost, note}]；match.tipId 指向其中一张
  function ensureTips() {
    var d = D();
    if (!Array.isArray(d.tips)) d.tips = [];
    var changed = false;
    var byId = {};
    d.tips.forEach(function (t) { byId[t.id] = t; });
    d.matches.forEach(function (m) {
      var tc = Number(m.tipCost) || 0;
      // 已经挂在有效料单上的，一律保留；顺手把该料单的成本同步到比赛上（取消 tipCost 输入框后靠这里兜）
      if (m.tipId && byId[m.tipId]) {
        if (Number(m.tipCost) !== Number(byId[m.tipId].cost)) {
          m.tipCost = Number(byId[m.tipId].cost) || 0; changed = true;
        }
        return;
      }
      if (tc <= 0) { if (m.tipId) { delete m.tipId; changed = true; } return; }
      var nm = String(m.note || "");
      var mm = /【([^】]+)】/.exec(nm);
      var base = mm ? mm[1] : "";
      var ds = String(m.date || "").replace(/-/g, "");
      // 先认领已有料单：同金额，且名字以这个名字结尾（云端带来的是「日期+名字」）
      var found = null;
      if (base) {
        found = d.tips.filter(function (t) {
          return Number(t.cost) === tc && String(t.name || "").indexOf(base) >= 0;
        })[0] || null;
      }
      if (!found) {
        var tid = "tip_" + (m.id || ("s" + m.seq));
        if (byId[tid]) found = byId[tid];
        else {
          found = { id: tid, name: (ds + (base || "料单")), cost: tc, note: "" };
          d.tips.push(found); byId[tid] = found; changed = true;
        }
      }
      if (m.tipId !== found.id) { m.tipId = found.id; changed = true; }
    });
    // 只清掉「没有金额、没有比赛引用、名字还是默认料单」的垃圾项；带名字的一律保留
    var before = d.tips.length;
    d.tips = d.tips.filter(function (t) {
      var used = d.matches.some(function (m) { return m.tipId === t.id; });
      return used || (Number(t.cost) > 0 && t.name && t.name !== "料单");
    });
    if (d.tips.length !== before) changed = true;
    if (changed) setTimeout(function () { try { Store.save(true); } catch (e) {} }, 0);
  }
  function tipById(id) {
    var d = D();
    return (d.tips || []).filter(function (t) { return t.id === id; })[0] || null;
  }
  function tipCostTotal() {
    var d = D();
    if (Array.isArray(d.tips) && d.tips.length) {
      return d.tips.reduce(function (s, t) { return s + (Number(t.cost) || 0); }, 0);
    }
    return d.matches.reduce(function (s, m) { return s + (Number(m.tipCost) || 0); }, 0);
  }
  function tipStats() {
    var d = D(), out = {};
    (d.tips || []).forEach(function (t) { out[t.id] = { tip: t, n: 0, pnl: 0, stake: 0, matches: [] }; });
    d.matches.forEach(function (m) {
      if (!m.tipId || !out[m.tipId]) return;
      out[m.tipId].matches.push(m);
      (m.legs || []).forEach(function (l) {
        var r = Engine.legPnl(m, l);
        out[m.tipId].pnl += r.pnl; out[m.tipId].stake += Number(l.stake) || 0;
      });
      out[m.tipId].n++;
    });
    return Object.keys(out).map(function (k) { return out[k]; });
  }

  function renderTipList() {
    var box = $("#tipList");
    if (!box) return;
    var st = tipStats().sort(function (a, b) { return b.tip.cost - a.tip.cost; });
    if (!st.length) { box.innerHTML = '<div class="note">还没有料单</div>'; return; }
    var total = 0, totalPnl = 0;
    box.innerHTML = '<div class="tbwrap"><table><thead><tr><th>料单</th><th class="num">成本</th>' +
      '<th class="num c-sm-hide">场次</th><th class="num">跟单盈亏</th><th></th></tr></thead><tbody>' +
      st.map(function (x) {
        total += x.tip.cost; totalPnl += x.pnl;
        var net = x.pnl - x.tip.cost;
        return "<tr><td>" + esc(x.tip.name) + "</td>" +
          '<td class="num">' + fmt(x.tip.cost) + "</td>" +
          '<td class="num c-sm-hide">' + x.n + "</td>" +
          '<td class="num ' + cls(net) + '">' + money(net) + "</td>" +
          '<td><button class="btn link" data-deltip="' + esc(x.tip.id) + '">删</button></td></tr>';
      }).join("") +
      '</tbody><tfoot><tr class="tot"><td>合计</td><td class="num">' + fmt(total) +
      '</td><td class="num c-sm-hide">—</td><td class="num ' + cls(totalPnl - total) + '">' +
      money(totalPnl - total) + "</td><td></td></tr></tfoot></table></div>" +
      '<div class="note" style="font-size:11.5px">「跟单盈亏」= 挂在这张料单下的比赛盈亏 − 料单成本。</div>';
    $$("#tipList [data-deltip]").forEach(function (b) {
      b.onclick = function () {
        var id = this.dataset.deltip;
        if (!confirm("删掉这张料单？（比赛不会被删，只是不再挂它）")) return;
        D().tips = (D().tips || []).filter(function (t) { return t.id !== id; });
        D().matches.forEach(function (m) { if (m.tipId === id) delete m.tipId; });
        Store.save(true); renderTipList(); renderHeader(); toast("已删除");
      };
    });
  }

  // ---------- 序号唯一性（两台设备各自递增会撞号，这里统一修） ----------
  function ensureSeqUnique() {
    var ms = D().matches || [];
    var mx = 0;
    ms.forEach(function (m) { var s = Number(m.seq) || 0; if (s > mx) mx = s; });
    var seen = {}, dup = 0;
    // 按 日期 → 序号 → 创建顺序 排，先出现的保留原号，后来的改成 mx+1
    ms.slice().sort(function (a, b) {
      var d = String(a.date || "").localeCompare(String(b.date || ""));
      if (d) return d;
      return (Number(a.seq) || 0) - (Number(b.seq) || 0);
    }).forEach(function (m) {
      var s = Number(m.seq) || 0;
      if (!s || seen[s]) { mx += 1; m.seq = mx; dup++; }
      seen[m.seq] = 1;
    });
    if (dup) setTimeout(function () { try { Store.save(true); } catch (e) {} }, 0);
    return dup;
  }

  // ---------- 数据访问 ----------
  function D() { return Store.data; }
  // 同一场次组内按开赛时间（HH:MM）排；没填时间的排在当天有时间的后面，最后用序号兜底
  function cmpTimeAsc(a, b) {
    var d = (a.date || "").localeCompare(b.date || "");
    if (d) return d;
    var ha = !!a.time, hb = !!b.time;
    if (ha !== hb) return ha ? -1 : 1;
    if (ha && a.time !== b.time) return a.time < b.time ? -1 : 1;
    return (a.seq || 0) - (b.seq || 0);
  }
  function cmpTimeDesc(a, b) {
    var d = (b.date || "").localeCompare(a.date || "");
    if (d) return d;
    var ha = !!a.time, hb = !!b.time;
    if (ha !== hb) return ha ? -1 : 1;
    if (ha && a.time !== b.time) return a.time < b.time ? 1 : -1;
    return (b.seq || 0) - (a.seq || 0);
  }
  function sorted() { return D().matches.slice().sort(cmpTimeDesc); }   // 系统内：倒序，新的在前
  function sortedAsc() { return D().matches.slice().sort(cmpTimeAsc); } // 导出/编号：正序，早的在前
  function allRows() { return Engine.flatten(D().matches); }
  function filtered() {
    var q = filters.q.trim().toLowerCase();
    return sorted().filter(function (m) {
      if (filters.league && m.league !== filters.league) return false;
      var hasSc = !!m.score;
      if (filters.scope === "open" && (hasSc && m.settled)) return false;
      if (filters.scope === "done" && !(hasSc && m.settled)) return false;
      if (filters.scope === "nobet" && !m.legs.some(function (l) { return !String(l.bet || "").trim(); })) return false;
      if (filters.scope === "nosettle" && !hasSc) return false;
      if (filters.scope === "unsure" && !(hasSc && !m.settled)) return false;
      if (filters.scope === "diff") {
        var bad = false;
        m.legs.forEach(function (l) {
          var a = Engine.autoSettle(m, l);
          if (a.pnl != null) {
            var cur = Engine.legPnl(m, l).pnl;
            if (Math.abs(a.pnl - cur) > 0.25) bad = true;
          }
        });
        if (!bad) return false;
      }
      if (!q) return true;
      // 「#12」这种带井号的：只按序号精确匹配，不再做全文模糊（否则 #1 会命中 #199）
      var seqQ = /^#\s*(\d+)$/.exec(q);
      if (seqQ) return String(m.seq) === seqQ[1];
      var hay = [m.home, m.away, m.league, m.note, m.score, m.date,
        m.time || "", m.ht || "", m.settled ? "已结算" : "未结算",
        m.timeSrc || "", Number(m.tipCost) ? "料单" + m.tipCost : "",
        "#" + m.seq, "第" + m.seq + "场", "编号" + m.seq
      ].join(" ").toLowerCase();
      if (hay.indexOf(q) >= 0) return true;
      // 注单维度：下注内容、备注、盈亏文字、金额、赔率
      return m.legs.some(function (l) {
        var r = Engine.legPnl(m, l);
        var ptxt = r.pnl > 0.004 ? "盈利 赢 赚 中" : (r.pnl < -0.004 ? "亏损 输 赔" : "走水 平");
        var lhay = [l.bet, l.note, l.odds, l.stake,
          r.pnl == null ? "" : String(Math.round(r.pnl)),
          r.pnl == null ? "" : (r.pnl > 0.004 ? "+" : "") + Math.round(r.pnl),
          ptxt].join(" ").toLowerCase();
        return lhay.indexOf(q) >= 0;
      });
    });
  }

  // ---------- 顶栏 ----------
  function renderHeader() {
    var rows = allRows();
    var a = Engine.agg(rows);
    ensureTips();
    var cost = tipCostTotal();
    var net = a.pnl - cost;
    // 三格指标：买球盈亏（盘口）/ 料单总价 / 加上料单的盈亏
    var g = $("#hGross");
    if (g) { g.textContent = money(a.pnl); g.className = "v num " + cls(a.pnl); }
    var c = $("#hCost");
    if (c) { c.textContent = cost ? "−" + fmt(cost) : "0"; c.className = "v num " + (cost ? "lose" : ""); }
    var n2 = $("#hNet2");
    if (n2) { n2.textContent = money(net); n2.className = "v num " + cls(net); }
    var el = $("#hNet");                       // 兼容旧引用
    if (el) { el.textContent = money(net); el.className = "num " + cls(net); }
    var nOpen = D().matches.filter(function (m) { return !m.score; }).length;
    var nUnsure = D().matches.filter(function (m) { return m.score && !m.settled; }).length;
    var modeTxt = Store.mode === "server" ? "局域网共享" : "本机离线";
    $("#subline").innerHTML = '<span class="chip">' + modeTxt + "</span> " +
      D().matches.length + " 场 · " + a.n + " 笔" +
      (nOpen ? " · 待赛果 " + nOpen : "") +
      (nUnsure ? " · 待确认 " + nUnsure : "");
    var tb = $$("#tabs button");
    tb.forEach(function (b) {
      b.classList.toggle("on", b.dataset.t === view);
      var old = b.querySelector(".dot"); if (old) old.remove();
      if (b.dataset.t === "data" && Store.state.dirty) {
        var s = document.createElement("span"); s.className = "dot"; b.appendChild(s);
      }
    });
  }
  function syncSave() { renderHeader(); renderConflict(); }
  function isEditing() { var s = $("#sheet"); return !!(s && s.classList.contains("on")); }
  function renderConflict() {
    var el = $("#conflict"); if (!el) return;
    var st = Store.state;
    if (!st.conflict || Store.mode !== "server") { el.className = "hide"; el.innerHTML = ""; return; }
    el.className = "";
    el.innerHTML = '<div class="cbar"><b>这份数据在别的设备上被改过，你刚才的改动没有保存。</b>' +
      '<div>直接写会把对方新录的内容整份覆盖，所以拦下来了。选一个：</div>' +
      '<div class="cbtns">' +
      '<button class="btn sm primary" id="cReload">载入对方的（推荐）</button>' +
      '<button class="btn sm" id="cForce">以我的为准，覆盖对方</button>' +
      '<button class="btn sm" id="cExport">先把我的导出成备份</button>' +
      '</div></div>';
    $("#cForce").onclick = function () {
      if (!confirm("用你现在的这份覆盖磁盘数据？对方新录的内容会丢。")) return;
      Store.forceFlush().then(function () { render(); toast("已按你的版本覆盖"); });
    };
    $("#cReload").onclick = function () {
      if (!confirm("放弃你刚才的改动，载入磁盘上的最新数据？")) return;
      Store.pull().then(function () { render(); toast("已载入最新的数据"); });
    };
    $("#cExport").onclick = function () { exportJson(); };
  }

  // 每 8 秒看一眼磁盘上的版本号：变了就自动同步；自己手上有没存的改动就报警
  function startSync() {
    if (Store.mode !== "server") return;
    setInterval(function () {
      var st = Store.state;
      if (st.saving || st.conflict || !st.rev) return;
      fetch("/api/rev", { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var v = j && j.rev;
          if (!v || v === st.rev) return;
          if (!st.dirty && !isEditing()) {
            Store.pull().then(function () { render(); toast("已同步其他设备刚录的内容"); });
          } else {
            st.conflict = true;
            st.conflictRev = v;
            renderConflict();
          }
        })
        .catch(function () {});
    }, 8000);
  }

  // ---------- 录入 ----------
  function viewEntry() {
    var list = filtered();
    var rows = allRows();
    var a = Engine.agg(rows);
    var pages = Math.max(1, Math.ceil(list.length / PER));
    if (page > pages) page = pages;
    var slice = list.slice((page - 1) * PER, page * PER);

    var lgSet = {};
    D().matches.forEach(function (m) { if (m.league) lgSet[m.league] = (lgSet[m.league] || 0) + 1; });
    var lgOpts = Object.keys(lgSet).sort(function (x, y) { return lgSet[y] - lgSet[x]; })
      .map(function (k) { return '<option value="' + esc(k) + '"' + (filters.league === k ? " selected" : "") + '>' + esc(k) + " (" + lgSet[k] + ")</option>"; }).join("");

    var h = [];
    h.push('<div class="bar">');
    h.push('<button class="btn primary" id="btnAdd">＋ 新增比赛</button>' +
      '<button class="btn" id="btnSync">同步赛果</button>' +
      '<button class="btn" id="btnSettle">一键结算</button>' +
      '<button class="btn" id="btnUndo">↶ 撤回</button>');
    h.push('<div class="search"><input type="text" id="fq" placeholder="搜球队 / 赛事 / 玩法" value="' + esc(filters.q) + '"></div>');
    h.push('<select class="sel" id="fscope">' +
      opt("all", "全部", filters.scope) + opt("unsure", "已有赛果·待确认", filters.scope) +
      opt("nosettle", "待录赛果", filters.scope) + opt("done", "已结算", filters.scope) +
      opt("diff", "盈亏有差异", filters.scope) + opt("nobet", "待填注单", filters.scope) + "</select>");
    h.push('<select class="sel" id="fleague"><option value="">全部赛事</option>' + lgOpts + "</select>");
    h.push("</div>");

    h.push('<div class="note num">共 <b>' + list.length + "</b> 场 / 投入 " + fmt(a.stake) +
      " / 盈亏 <b class='" + cls(a.pnl) + "'>" + money(a.pnl) + "</b> / 回报率 " + fmt(a.roi, 1) + "%</div>");
    if (Store.mode === "local") {
      h.push('<div class="note warn" style="margin:4px 0 10px">离线模式：数据只存在这台电脑的这个浏览器里，手机看不到。' +
        '要用手机看和改，请关掉本页，双击文件夹里的「启动服务器.bat」再打开。</div>');
    }

    if (!slice.length) {
      h.push('<div class="empty card"><h3>这里还是空的</h3><p>换个筛选条件，或者先记一场。</p>' +
        '<button class="btn primary" id="btnAdd2">＋ 新增比赛</button></div>');
    } else {
      h.push('<div class="mlist">');
      slice.forEach(function (m) { h.push(matchCard(m)); });
      h.push("</div>");
      if (pages > 1) {
        h.push('<div class="pager"><button class="btn sm" id="pgPrev"' + (page <= 1 ? " disabled" : "") + '>上一页</button>' +
          '<span class="num">' + page + " / " + pages + '</span>' +
          '<button class="btn sm" id="pgNext"' + (page >= pages ? " disabled" : "") + '>下一页</button></div>');
      }
    }
    $("#v-entry").innerHTML = h.join("");

    $("#btnAdd") && ($("#btnAdd").onclick = function () { openEdit(null); });
    $("#btnAdd2") && ($("#btnAdd2").onclick = function () { openEdit(null); });
    $("#btnSync") && ($("#btnSync").onclick = syncResults);
    $("#btnSettle") && ($("#btnSettle").onclick = openSettleSheet);
    $("#btnUndo") && ($("#btnUndo").onclick = undoRun);
    renderUndoBtn();
    // 搜索框：边打字边过滤，但**不能每敲一个键就重建输入框**（焦点和输入法都会被打断）。
    // 做法：记下值 → 停手 180ms 再重绘列表 → 重绘后把焦点和光标还原。
    var _fqTim = null;
    function applySearch() {
      var box0 = $("#fq");
      filters.q = box0 ? box0.value : filters.q;
      page = 1;
      viewEntry();
      var box = $("#fq");
      if (box) {
        box.focus();
        try { var n = box.value.length; box.setSelectionRange(n, n); } catch (e) {}
      }
    }
    var fq = $("#fq");
    fq.oninput = function (ev) {
      filters.q = this.value;
      if (this._composing || (ev && ev.isComposing)) return;   // 输入法组字中不动 DOM
      clearTimeout(_fqTim);
      _fqTim = setTimeout(applySearch, 180);
    };
    fq.addEventListener("compositionstart", function () { this._composing = true; });
    fq.addEventListener("compositionend", function () {
      this._composing = false;
      filters.q = this.value;
      clearTimeout(_fqTim);
      setTimeout(applySearch, 60);
    });
    $("#fscope").onchange = function () { filters.scope = this.value; page = 1; viewEntry(); };
    $("#fleague").onchange = function () { filters.league = this.value; page = 1; viewEntry(); };
    $("#pgPrev") && ($("#pgPrev").onclick = function () { page--; viewEntry(); window.scrollTo(0, 0); });
    $("#pgNext") && ($("#pgNext").onclick = function () { page++; viewEntry(); window.scrollTo(0, 0); });
    $$(".mc").forEach(function (el) {
      el.onclick = function (e) {
        if (e.target.closest("button")) return;
        openEdit(el.dataset.id);
      };
    });
  }
  function opt(v, t, cur) { return '<option value="' + v + '"' + (cur === v ? " selected" : "") + ">" + t + "</option>"; }

  function matchCard(m) {
    var pnl = 0, staked = 0;
    var pending = !m.score;
    var rowsHtml = m.legs.map(function (l) {
      var r = Engine.legPnl(m, l);
      pnl += r.pnl; staked += Number(l.stake) || 0;
      var auto = Engine.autoSettle(m, l);
      var diff = !pending && (auto.pnl != null && Math.abs(auto.pnl - r.pnl) > 0.25);
      var pn = pending
        ? '<span class="push">—</span>'
        : money(r.pnl);
      return '<div class="lg-row">' +
        '<div class="bo" title="' + esc(l.bet) + '">' + esc(l.bet) + (diff ? ' <span class="badge p">核对</span>' : "") + "</div>" +
        '<div class="od num">' + (l.odds == null ? "—" : fmt(l.odds, 2)) + "</div>" +
        '<div class="sk num">' + (l.stake == null ? "—" : fmt(l.stake)) + "</div>" +
        '<div class="pn num ' + (pending ? "" : cls(r.pnl)) + '">' + pn + "</div></div>";
    }).join("");
    var settled = !!m.settled;
    var st = m.score
      ? (settled ? '<span class="badge l">已结算</span>' : '<span class="badge p">待确认</span>')
      : '<span class="badge n">待赛果</span>';
    var tip = Number(m.tipCost) || 0;
    return '<div class="mc" data-id="' + m.id + '">' +
      '<div class="mc-h"><span class="sq num">#' + (m.seq || "") + "</span>" +
      '<span class="num">' + (m.date || "").replace(/-/g, ".") + " " + dow(m.date) + "</span>" +
      (m.time ? '<span class="num">' + esc(m.time) + "</span>" : "") +
      (m.league ? '<span class="lg' + (m.leagueConf && m.leagueConf !== "高" ? " q" : "") + '">' + esc(m.league) + "</span>" : "") +
      '<span class="st">' + st + "</span></div>" +
      '<div class="mc-b"><div class="tm">' + esc(m.home) + '</div>' +
      '<div class="sc num' + (m.score ? "" : " no") + '">' + (m.score || "vs") + "</div>" +
      '<div class="tm r">' + esc(m.away) + "</div></div>" +
      '<div class="mc-l">' + rowsHtml + "</div>" +
      '<div class="mc-f"><span class="sum num ' + (pending ? "push" : cls(pnl)) + '">' +
      (pending ? "待结算" : money(pnl)) + "</span>" +
      '<span class="num">投入 ' + fmt(staked) + "</span>" +
      (tip ? '<span class="num">料单 ' + fmt(tip) + "</span>" : "") +
      (m.note ? '<span class="note-in">' + esc(m.note) + "</span>" : '<span class="sp"></span>') +
      '<span class="btn link">编辑</span></div></div>';
  }

  // ---------- 编辑表单 ----------
  function openEdit(id) {
    var m;
    if (id) {
      m = D().matches.filter(function (x) { return x.id === id; })[0];
      if (!m) return;
      editing = JSON.parse(JSON.stringify(m));
      editing._isNew = false;
    } else {
      var today = Engine.ymd(new Date());
      editing = {
        id: "m" + Date.now().toString(36), seq: Store.nextSeq(), date: today, time: "",
        league: "", leagueConf: "", home: "", away: "", score: "", note: "", tipCost: 0,
        settled: false, legs: [{ id: "b" + Date.now().toString(36), bet: "", odds: "", stake: "", pnl: null, manual: null }],
        _isNew: true
      };
    }
    $("#sheetT").textContent = editing._isNew ? "新增比赛" : ("编辑 #" + editing.seq);
    renderEditForm();
    $("#sheetF").innerHTML = '<button class="btn ghost" id="eDel">' + (editing._isNew ? "取消" : "删除本场") + "</button>" +
      '<button class="btn primary" id="eSave">保存</button>';
    $("#eDel").onclick = function () {
      if (editing._isNew) { closeSheet(); return; }
      if (!confirm("确定删除 #" + editing.seq + " " + editing.home + " vs " + editing.away + "？")) return;
      var i = D().matches.findIndex(function (x) { return x.id === editing.id; });
      if (i >= 0) {
        undoBegin();
        D().matches.splice(i, 1);
        undoCommit("删除比赛 #" + editing.seq);
      }
      Store.save(); closeSheet(); render(); toast("已删除");
    };
    $("#eSave").onclick = saveEdit;
    openSheet();
  }

  function renderEditForm() {

    var lgList = {};
    D().matches.forEach(function (m) { if (m.league) lgList[m.league] = 1; });
    var dl = Object.keys(lgList).sort().map(function (k) { return "<option>" + esc(k) + "</option>"; }).join("");
