    var tipOpts = '<option value="">（不属于任何料单）</option>' +
      (D().tips || []).map(function (t) {
        return '<option value="' + esc(t.id) + '"' + (e.tipId === t.id ? " selected" : "") + ">" +
          esc(t.name) + "（" + fmt(t.cost) + " 元）</option>";
      }).join("") +
      '<option value="__new__">＋ 新建料单（多场共用一张时选这里）</option>';
    h.push('<div class="fg"><div><label>赛事 / 联赛</label><input type="text" id="eLeague" list="lgdl" value="' + esc(e.league) + '" placeholder="英超 / 欧冠 / 国王杯">' +
      '<datalist id="lgdl">' + dl + "</datalist></div>" +
      '<div><label>所属料单</label><select id="eTipSel">' + tipOpts + "</select></div></div>");
    h.push('<div class="fg"><div><label>主队</label><input type="text" id="eHome" value="' + esc(e.home) + '"></div>' +
      '<div><label>客队</label><input type="text" id="eAway" value="' + esc(e.away) + '"></div></div>');
    h.push('<div class="fg"><div><label>比分（主:客，未开赛留空）</label><input type="text" id="eScore" value="' + esc(e.score) + '" placeholder="2:1"></div>' +
      '<div><label>是否结算</label><select id="eSettled"><option value="0"' + (!e.settled ? " selected" : "") + '>未结算</option>' +
      '<option value="1"' + (e.settled ? " selected" : "") + '>已结算</option></select></div></div>');
    h.push('<div class="fg one"><div><label>备注（代买人 / 料单）</label><input type="text" id="eNote" value="' + esc(e.note) + '"></div></div>');
    h.push('<div class="sec" style="margin:10px 0 4px">额外数据（半场盘 / 角球 / 黄牌 需要它才能自动算）</div>');
    h.push('<div class="fg"><div><label>半场比分（主:客）</label><input type="text" id="eHT" value="' + esc(e.ht || "") + '" placeholder="1:0"></div>' +
      '<div><label>角球数（合计）</label><input type="number" step="1" id="eCorners" value="' + (e.corners == null ? "" : e.corners) + '" placeholder="10"></div></div>');
    h.push('<div class="fg"><div><label>黄牌数（合计）</label><input type="number" step="1" id="eCards" value="' + (e.cards == null ? "" : e.cards) + '" placeholder="4"></div>' +
      '<div><label>&nbsp;</label><div class="note" style="margin:0">留空则该类注单显示「需角球数/需黄牌数」</div></div></div>');

    h.push('<div class="sec" style="margin:14px 0 6px">注单 <span class="num" id="legCount">' + e.legs.length + " 笔</span></div>");
    h.push('<div class="lgs">');
    if (!e.legs.length) h.push('<div style="padding:14px;text-align:center;color:var(--muted);font-size:12.5px">还没有注单</div>');
    e.legs.forEach(function (l, i) { h.push('<div class="lg-edit">' + legEditHtml(l, i) + "</div>"); });
    h.push("</div>");
    h.push('<button class="btn" id="eAddLeg" style="width:100%;justify-content:center;margin-top:8px">＋ 加一笔注单</button>');

    // 汇总
    var tmp = JSON.parse(JSON.stringify(e)); tmp.legs = e.legs;
    var pnl = 0, staked = 0, diffN = 0;
    e.legs.forEach(function (l) {
      var r = Engine.legPnl(tmp, l);
      pnl += r.pnl; staked += Number(l.stake) || 0;
      var a = Engine.autoSettle(tmp, l);
      if (a.pnl != null && Math.abs(a.pnl - r.pnl) > 0.25) diffN++;
    });
    h.push('<div class="om" style="margin-top:10px"><span>本场合计 <b class="' + cls(pnl) + ' num">' + money(pnl) +
      '</b></span><span>投入 <b class="num">' + fmt(staked) + '</b></span>' +
      (diffN ? '<span class="dirty">' + diffN + " 笔与规则结算不一致</span>" : "") + "</div>");

    $("#sheetB").innerHTML = h.join("");
    bindEdit();
  }

  function legEditHtml(l, i) {
    var m = editing;
    var a = Engine.autoSettle(m, l);
    var cur = Engine.legPnl(m, l);
    var manualOn = (l.manual != null && l.manual !== "");
    var autoTxt = a.code
      ? '<span class="z">' + Engine.CODE_CN[a.code] + " " + money(a.pnl) + "</span>"
      : '<span class="z">' + (a.why || "—") + "</span>";
    return '<div class="r1">' +
      '<input type="text" data-i="' + i + '" data-f="bet" value="' + esc(l.bet) + '" placeholder="下注内容，如 曼城-1.5/2">' +
      '<input type="number" step="0.01" data-i="' + i + '" data-f="odds" value="' + (l.odds == null ? "" : l.odds) + '" placeholder="赔率">' +
      '<input type="number" step="1" data-i="' + i + '" data-f="stake" value="' + (l.stake == null ? "" : l.stake) + '" placeholder="金额">' +
      '</div>' +
      '<div class="r1" style="margin-top:4px">' +
      '<input type="text" data-i="' + i + '" data-f="note" value="' + esc(l.note || "") + '" ' +
      'placeholder="这笔的备注（滚球写「滚球2:1时下单」，写下注那一刻的比分）" style="grid-column:1 / -1">' +
      '</div><div class="r2">' +
      '<div class="auto">规则结算 ' + autoTxt + "</div>" +
      '<div class="auto">' + (cur.src === "manual" ? '采用手工 <span class="z num">' + money(cur.pnl) + "</span>"
        : '采用 <span class="z num">' + money(cur.pnl) + "</span>") + "</div>" +
      '<div style="display:flex;gap:4px">' +
      '<button class="btn sm ghost" data-manual="' + i + '" title="手工锁定盈亏">' + (manualOn ? "改回自动" : "手工") + "</button>" +
      '<button class="del" data-del="' + i + '" title="删除">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg></button>' +
      "</div></div>" +
      (manualOn ? '<div style="margin-top:6px"><input type="number" step="0.1" data-i="' + i + '" data-f="manual" value="' + l.manual + '" placeholder="手工盈亏（正负）"></div>' : "");
  }

  function bindEdit() {
    var e = editing;
    function B(id, f, num) {
      var el = $("#" + id); if (!el) return;
      var sync = function () {
        e[f] = num ? (el.value === "" ? null : Number(el.value)) : el.value;
      };
      // 只用刷新结算提示，绝不重建表单：一旦重建，输入框连同正在进行的输入法组字一起没了
      var after = function () {
        if (f === "home" || f === "away" || f === "score") refreshAllAuto();
      };
      el.addEventListener("compositionstart", function () { el._composing = true; });
      el.addEventListener("compositionend", function () {
        el._composing = false;
        sync();
        after();
      });
      el.oninput = function (ev) {
        sync();
        if (el._composing || (ev && ev.isComposing)) return;   // 组字中不碰 DOM
        after();
      };
      el.onchange = function () { sync(); after(); };
    }
    B("eDate", "date"); B("eTime", "time");
    B("eLeague", "league");
    $("#eTipSel").onchange = function () {
      var raw = this.value;
      if (raw === "__new__") {
        var nm = prompt("料单名称（例如 一炮红 / 三步上篮）", "");
        if (!nm) { this.value = e.tipId || ""; return; }
        var cs = prompt("这张料单多少钱？（只填一次，多场共用）", "");
        var cost = Number(String(cs || "").replace(/[^\d.]/g, ""));
        if (!isFinite(cost) || cost <= 0) { toast("金额不对，没建成"); this.value = e.tipId || ""; return; }
        var t = { id: "t" + Math.random().toString(36).slice(2, 8), name: String(nm).trim(), cost: cost, note: "" };
        D().tips = D().tips || [];
        D().tips.push(t);
        e.tipId = t.id; e.tipCost = cost;
        var opt = document.createElement("option");
        opt.value = t.id; opt.textContent = t.name + "（" + fmt(cost) + " 元）"; opt.selected = true;
        this.insertBefore(opt, this.lastElementChild);
        raw = t.id;
        toast("已新建料单「" + t.name + "」" + fmt(cost) + " 元");
      }
      // 立刻同时写进「正在编辑的对象」和「库里那条记录」，
      // 否则选完触发的重绘会把编辑对象重新克隆，刚选的料单就丢了
      // 记到临时变量里：即使中途重绘把下拉重建，保存时也能拿到这次的选择
      if (raw && raw !== "__new__") window._pendingTip = raw; else window._pendingTip = null;
      if (raw) {
        e.tipId = raw;
        var tp = (D().tips || []).filter(function (x) { return x.id === raw; })[0];
        if (tp) e.tipCost = Number(tp.cost) || 0;
      } else { delete e.tipId; e.tipCost = 0; }
      if (e.id) {
        var base = D().matches.filter(function (x) { return x.id === e.id; })[0];
        if (base) {
          base.tipId = e.tipId; base.tipCost = e.tipCost;
          // 选中即落盘：不依赖后面点「保存」，避免重绘把它冲掉
          try { Store.save(true); } catch (err) {}
        }
      }
    };
    B("eHome", "home"); B("eAway", "away"); B("eScore", "score"); B("eNote", "note");
    B("eHT", "ht");
    B("eCorners", "corners", true); B("eCards", "cards", true);
    $("#eSettled").onchange = function () { e.settled = this.value === "1"; };

    $$("#sheetB [data-f]").forEach(function (el) {
      if (["eDate", "eTime", "eLeague", "eTipSel", "eHome", "eAway", "eScore", "eNote", "eHT", "eCorners", "eCards"].indexOf(el.id) >= 0) return;
      el.oninput = function () {
        var i = +this.dataset.i, f = this.dataset.f;
        var l = e.legs[i]; if (!l) return;
        l[f] = this.value === "" ? (f === "bet" ? "" : null) : (f === "bet" ? this.value : Number(this.value));
        if (f === "bet" || f === "odds" || f === "stake" || f === "manual") {
          // 只刷新结算提示，不重建整表（保住输入焦点）
          refreshAutoLine(i);
          refreshTotals();
        }
      };
    });
    $("#eAddLeg").onclick = function () {
      e.legs.push({ id: "b" + Math.random().toString(36).slice(2, 9), bet: "", odds: null, stake: null, pnl: null, manual: null });
      renderEditForm();
    };
    $$("[data-del]").forEach(function (b) {
      b.onclick = function () { e.legs.splice(+this.dataset.del, 1); renderEditForm(); };
    });
    bindPicker();
    $$("[data-manual]").forEach(function (b) {
      b.onclick = function () {
        var i = +this.dataset.manual, l = e.legs[i];
        if (l.manual != null && l.manual !== "") l.manual = null;
        else {
          var cur = Engine.legPnl(e, l);
          l.manual = Math.round(cur.pnl * 100) / 100;
        }
        renderEditForm();
      };
    });
  }
  function refreshAllAuto() {
    for (var i = 0; i < editing.legs.length; i++) refreshAutoLine(i);
    refreshTotals();
  }
  function refreshAutoLine(i) {
    var el = $$("#sheetB .lg-edit")[i];
    if (!el) return;
    var a = Engine.autoSettle(editing, editing.legs[i]);
    var cur = Engine.legPnl(editing, editing.legs[i]);
    var d = el.querySelectorAll(".auto");
    if (d[0]) d[0].innerHTML = "规则结算 " + (a.code
      ? '<span class="z">' + Engine.CODE_CN[a.code] + " " + money(a.pnl) + "</span>"
      : '<span class="z">' + (a.why || "—") + "</span>");
    if (d[1]) d[1].innerHTML = (cur.src === "manual" ? "采用手工 " : "采用 ") + '<span class="z num">' + money(cur.pnl) + "</span>";
  }
  function refreshTotals() {
    var pnl = 0, staked = 0, diffN = 0;
    editing.legs.forEach(function (l) {
      var r = Engine.legPnl(editing, l);
      pnl += r.pnl; staked += Number(l.stake) || 0;
      var a = Engine.autoSettle(editing, l);
      if (a.pnl != null && Math.abs(a.pnl - r.pnl) > 0.25) diffN++;
    });
    var om = $("#sheetB .om");
    if (om) om.innerHTML = '<span>本场合计 <b class="' + cls(pnl) + ' num">' + money(pnl) + '</b></span><span>投入 <b class="num">' +
      fmt(staked) + "</b></span>" + (diffN ? '<span class="dirty">' + diffN + " 笔与规则结算不一致</span>" : "");
    var lc = $("#legCount"); if (lc) lc.textContent = editing.legs.length + " 笔";
  }

  function saveEdit() {
    var e = editing;
    // 以「保存这一刻下拉框的实际值」为准，避免中途重绘把选择冲掉
    var selEl = $("#eTipSel");
    var chosen = selEl ? selEl.value : "";
    if (!chosen || chosen === "__new__") chosen = window._pendingTip || "";
    if (chosen && chosen !== "__new__") {
      e.tipId = chosen;
      var tp = (D().tips || []).filter(function (x) { return x.id === chosen; })[0];
      e.tipCost = tp ? (Number(tp.cost) || 0) : (Number(e.tipCost) || 0);
    } else { delete e.tipId; e.tipCost = 0; }
    window._pendingTip = null;
    e.legs = e.legs.filter(function (l) { return l.bet || l.stake; });
    e.legs.forEach(function (l) {
      if (l.bet) l.bet = String(l.bet).trim();
      if (l.odds === "" ) l.odds = null;
      if (l.stake === "") l.stake = null;
    });
    // 比分统一成半角冒号：中文输入法打出来的「1：0」会让软件算不出结果
    if (e.score) {
      var raw = String(e.score);
      e.score = raw.replace(/：/g, ":").replace(/[，,、\s]/g, "").trim();
      if (e.score && !/^\d+:\d+$/.test(e.score)) {
        if (!confirm("比分「" + raw + "」看起来不是「2:1」这样，仍要保存吗？（软件将无法自动结算这场）")) return;
      }
    }
    if (e.ht) {
      e.ht = String(e.ht).replace(/：/g, ":").replace(/[，,、\s]/g, "").trim();
      if (e.ht && !/^\d+:\d+$/.test(e.ht)) {
        if (!confirm("半场比分「" + e.ht + "」不是「1:0」这样，仍要保存吗？（半场盘将无法自动结算）")) return;
      }
    }
    ["corners", "cards"].forEach(function (k) {
      if (e[k] === "" || e[k] === undefined || e[k] === null) e[k] = null;
      else if (isFinite(Number(e[k]))) e[k] = Number(e[k]);
    });
    if (!e.home && !e.away && !e.legs.length) { toast("至少填个球队或注单"); return; }
    delete e._isNew;
    undoBegin();
    var idx = D().matches.findIndex(function (x) { return x.id === e.id; });
    var merged = false;
    if (idx >= 0) {
      D().matches[idx] = e;
    } else {
      // 同一场比赛只留一条记录：同日期+同主客就并进去（滚球只是多加一笔注单，不新开一场）
      var same = D().matches.filter(function (x) {
        return x.date === e.date && x.home === e.home && x.away === e.away;
      })[0];
      if (same) {
        e.legs.forEach(function (l) {
          l.id = "b" + Math.random().toString(36).slice(2, 9);
          same.legs.push(l);
        });
        if (e.score && !same.score) { same.score = e.score; same.settled = e.settled; }
        if (Number(e.tipCost)) same.tipCost = (Number(same.tipCost) || 0) + Number(e.tipCost);
        if (e.note) same.note = (same.note ? same.note + " / " : "") + e.note;
        merged = true;
      } else {
        D().matches.push(e);
      }
    }
    undoCommit(merged ? "合并注单" : "保存比赛");
    Store.save();
    closeSheet();
    render();
    toast(merged ? "这场已有记录，注单已并到原来那条上" : "已保存");
  }

  // ---------- 曲线 ----------
  function viewCurve() {
    var rows = allRows();
    ensureTips();
    var cost = tipCostTotal();
    var a = Engine.agg(rows);
    var net = a.pnl - cost;

    // 按日聚合
    var byDay = {};
    rows.forEach(function (r) {
      if (!r.date) return;
      var d = byDay[r.date] || (byDay[r.date] = { pnl: 0, stake: 0, n: 0, win: 0 });
      d.pnl += r.pnl; d.stake += r.stake; d.n++;
      if (r.pnl > 0.004) d.win++;
    });
    D().matches.forEach(function (m) {
      if (!m.date) return;
      var d = byDay[m.date] || (byDay[m.date] = { pnl: 0, stake: 0, n: 0, win: 0 });
      d.cost = (d.cost || 0) + (Number(m.tipCost) || 0);
    });
    var dates = Object.keys(byDay).sort();
    var acc = 0, peak = 0, maxDD = 0, series = [];
    var accCost = 0;
    dates.forEach(function (d) {
      var v = byDay[d].pnl;
      accCost += byDay[d].cost || 0;
      acc += v;
      var vv = curveOpt.withCost ? acc - accCost : acc;
      series.push({ d: d, v: vv, raw: v, stake: byDay[d].stake, n: byDay[d].n });
      if (vv > peak) peak = vv;
      if (peak - vv > maxDD) maxDD = peak - vv;
    });
    var last = series.length ? series[series.length - 1].v : 0;

    var h = [];
    h.push('<div class="kpis">');
    h.push(kpi("累计净盈亏", money(net), "含料单 −" + fmt(cost), cls(net)));
    h.push(kpi("回报率 ROI", fmt(a.roi, 1) + "%", "记录盈亏 / 总投入", cls(a.roi)));
    h.push(kpi("总投入", fmt(a.stake), a.n + " 笔 · " + D().matches.length + " 场"));
    h.push(kpi("最大回撤", "−" + fmt(maxDD), "峰值回落", maxDD > 0 ? "lose" : ""));
    h.push("</div>");

    h.push('<div class="chartwrap"><div class="ttl"><span>累计盈亏曲线</span><span class="sp"></span>' +
      '<button class="btn sm' + (curveOpt.withCost ? " primary" : " ghost") + '" id="cCost" style="font-size:11.5px">' + (curveOpt.withCost ? "已扣料单" : "未扣料单") + '</button></div>');
    h.push('<div id="csvg"></div><div class="tip" id="ctip"></div></div>');

    h.push('<div class="chartwrap" style="margin-top:10px"><div class="ttl"><span>每日盈亏</span><span class="sp"></span>' +
      '<span class="num" style="color:var(--muted);font-weight:400">' + dates.length + " 个交易日</span></div><div id=\"cbars\"></div></div>");

    $("#v-curve").innerHTML = h.join("");
    $("#cCost").onclick = function () { curveOpt.withCost = !curveOpt.withCost; viewCurve(); };
    drawCurve(series);
    drawBars(series);
  }

  function kpi(k, v, d, c) {
    return '<div class="kpi"><div class="k">' + k + '</div><div class="v num ' + (c || "") + '">' + v +
      "</div>" + (d ? '<div class="d num">' + d + "</div>" : "") + "</div>";
  }

  // 取整齐的刻度：1/2/2.5/5 × 10^n
  function niceStep(range, n) {
    var raw = range / Math.max(1, n);
    var exp = Math.floor(Math.log(raw) / Math.LN10);
    var f = raw / Math.pow(10, exp);
    var nf = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
    return nf * Math.pow(10, exp);
  }
  function axisScale(mn, mx, n) {
    if (!(mx > mn)) { mx = mn + 1; }
    var step = niceStep(mx - mn, n);
    var lo = Math.floor(mn / step) * step;
    var hi = Math.ceil(mx / step) * step;
    return { lo: lo, hi: hi, step: step };
  }

  function drawCurve(series) {
    var box = $("#csvg"); if (!box || !series.length) { if (box) box.innerHTML = '<div class="empty">还没有可画的结算数据</div>'; return; }
    var W = Math.max(320, box.clientWidth || 340), H = 210, P = { l: 46, r: 10, t: 10, b: 24 };
    var vals = series.map(function (s) { return s.v; });
    var rawMn = Math.min(0, Math.min.apply(null, vals)), rawMx = Math.max(0, Math.max.apply(null, vals));
    var pad = Math.max(1, rawMx - rawMn) * 0.10;
    var sc = axisScale(rawMn < 0 ? rawMn - pad : rawMn, rawMx + pad, 4);
    var mn = sc.lo, mx = sc.hi;
    var X = function (i) { return P.l + (series.length === 1 ? (W - P.l - P.r) / 2 : i * (W - P.l - P.r) / (series.length - 1)); };
    var Y = function (v) { return P.t + (mx - v) / (mx - mn) * (H - P.t - P.b); };

    var dline = "", darea = "";
    series.forEach(function (s, i) {
      var x = X(i), y = Y(s.v);
      dline += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    });
    darea = dline + "L" + X(series.length - 1).toFixed(1) + " " + Y(0).toFixed(1) + "L" + X(0).toFixed(1) + " " + Y(0).toFixed(1) + "Z";

    var grid = "", labels = "";
    for (var v = mn; v <= mx + 1e-9; v += sc.step) {
      var y = Y(v);
      grid += '<line x1="' + P.l + '" y1="' + y.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + y.toFixed(1) +
        '" stroke="#EEF0ED" stroke-width="1"/>';
      labels += '<text x="' + (P.l - 6) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end" font-size="9.5" fill="#8A8F98">' +
        fmt(Math.abs(v) < 1e-9 ? 0 : v, 0) + "</text>";
    }
    var y0 = Y(0);
    var zeroLine = '<line x1="' + P.l + '" y1="' + y0.toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + y0.toFixed(1) + '" stroke="#C9CED4" stroke-width="1"/>';

    // x 轴：首、中、尾
    var xi = [0, Math.floor((series.length - 1) / 2), series.length - 1].filter(function (v, i, a) { return a.indexOf(v) === i; });
    var xlab = xi.map(function (i) {
      var anc = i === 0 ? "start" : (i === series.length - 1 ? "end" : "middle");
      var ax = i === 0 ? X(0) - 2 : (i === series.length - 1 ? X(i) + 2 : X(i));
      return '<text x="' + ax.toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anc + '" font-size="9.5" fill="#8A8F98">' + md(series[i].d) + "</text>";
    }).join("");

    var lastV = series[series.length - 1].v;
    var col = lastV >= 0 ? "#B03A2E" : "#1E7B4F";
    var dots = "";
    if (series.length <= 60) {
      series.forEach(function (s, i) {
        dots += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(s.v).toFixed(1) + '" r="2.2" fill="' + col + '" opacity=".55"/>';
      });
    }
    var svg = '<svg class="ch" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="height:' + H + 'px">' +
      '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + col + '" stop-opacity=".18"/>' +
      '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
      grid + zeroLine +
      '<path d="' + darea + '" fill="url(#g1)"/>' +
      '<path d="' + dline + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      dots + labels + xlab +
      '<circle cx="' + X(series.length - 1).toFixed(1) + '" cy="' + Y(lastV).toFixed(1) + '" r="3.4" fill="' + col + '" stroke="#fff" stroke-width="1.5"/>' +
      "</svg>";
    box.innerHTML = svg;

    // 交互
    var tip = $("#ctip");
    box.onmousemove = box.ontouchmove = function (ev) {
      var rect = box.getBoundingClientRect();
      var cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
      var i = Math.round((cx - P.l) / Math.max(1, (W - P.l - P.r)) * (series.length - 1));
      i = Math.max(0, Math.min(series.length - 1, i));
      var s = series[i];
      tip.innerHTML = "<b>" + s.d + "</b><br>累计 " + money(s.v) + " · 当日 " + money(s.raw) +
        "<br>投入 " + fmt(s.stake) + " · " + s.n + " 笔";
      tip.style.left = Math.min(Math.max(X(i), 60), W - 60) + "px";
      tip.style.top = (Y(s.v) - 10) + "px";
      tip.classList.add("on");
    };
    (box.onmouseleave = box.ontouchend = function () { tip.classList.remove("on"); });
  }

  function drawBars(series) {
    var box = $("#cbars"); if (!box) return;
    if (!series.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
    var W = Math.max(320, box.clientWidth || 340), H = 130, P = { l: 46, r: 8, t: 8, b: 20 };
    var vals = series.map(function (s) { return s.raw; });
    var rawMx = Math.max(0, Math.max.apply(null, vals)), rawMn = Math.min(0, Math.min.apply(null, vals));
    var padv = Math.max(1, rawMx - rawMn) * 0.06;
    var sc = axisScale(rawMn < 0 ? rawMn - padv : rawMn, rawMx + padv, 2);
    var mn = sc.lo, mx = sc.hi;
    var Y = function (v) { return P.t + (mx - v) / (mx - mn) * (H - P.t - P.b); };
    var bw = Math.max(1.5, (W - P.l - P.r) / series.length - 1.2);
    var bars = "";
    series.forEach(function (s, i) {
      var x = P.l + i * (W - P.l - P.r) / series.length;
      var y = Y(Math.max(0, s.raw)), h2 = Math.abs(Y(s.raw) - Y(0));
      bars += '<rect x="' + (x + 0.6).toFixed(1) + '" y="' + (s.raw >= 0 ? y : Y(0)).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.8, h2).toFixed(1) + '" fill="' +
        (s.raw >= 0 ? "#B03A2E" : "#1E7B4F") + '" opacity=".75" rx=".6"/>';
    });
    var ticks = "";
    [mx, 0, mn].forEach(function (v) {
      ticks += '<line x1="' + P.l + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - P.r) + '" y2="' + Y(v).toFixed(1) +
        '" stroke="#EEF0ED"/><text x="' + (P.l - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) +
        '" text-anchor="end" font-size="9.5" fill="#8A8F98">' + (Math.abs(v) < 1e-9 ? "0" : fmt(v, 0)) + "</text>";
    });
    box.innerHTML = '<svg class="ch" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="height:' + H + 'px">' +
      ticks + bars +
      '<text x="' + (P.l + 2) + '" y="' + (H - 6) + '" font-size="9.5" fill="#8A8F98">' + md(series[0].d) +
      '</text><text x="' + (W - P.r) + '" y="' + (H - 6) + '" text-anchor="end" font-size="9.5" fill="#8A8F98">' +
      md(series[series.length - 1].d) + "</text></svg>";
  }

  // ---------- 总结 ----------
  function viewSum() {
    var rows = allRows();
    var keyFn = sumMode === "day" ? function (r) { return r.date; }
      : sumMode === "week" ? function (r) { return r.date ? Engine.weekStart(r.date) : ""; }
        : function (r) { return r.date ? r.date.slice(0, 7) : ""; };
    var groups = Engine.groupBy(rows, function (r) { return keyFn(r) || "?"; });
    var costBy = {};
    D().matches.forEach(function (m) {
      var k = sumMode === "day" ? m.date : sumMode === "week" ? (m.date ? Engine.weekStart(m.date) : "?") : (m.date ? m.date.slice(0, 7) : "?");
      costBy[k] = (costBy[k] || 0) + (Number(m.tipCost) || 0);
    });
    groups.sort(function (a, b) { return a.key < b.key ? 1 : -1; });

    var h = [];
    h.push('<div class="bar"><select class="sel" id="sumMode" style="min-width:110px">' +
      opt("day", "按日", sumMode) + opt("week", "按周（周一起）", sumMode) + opt("month", "按月", sumMode) + "</select>" +
      '<span class="note" style="margin:0">共 ' + groups.length + " 个周期</span></div>");

    var tot = { stake: 0, pnl: 0, cost: 0, n: 0 };
    var body = groups.map(function (g) {
      var c = costBy[g.key] || 0, net = g.pnl - c;
      tot.stake += g.stake; tot.pnl += g.pnl; tot.cost += c; tot.n += g.n;
      var nm = sumMode === "week" ? (md(g.key) + " 周") : sumMode === "month" ? g.key.replace("-", " 年 ") + " 月" : (md(g.key) + " " + dow(g.key));
      var nMatch = 0;
      D().matches.forEach(function (m) {
        var k = sumMode === "day" ? m.date : sumMode === "week" ? (m.date ? Engine.weekStart(m.date) : "?") : (m.date ? m.date.slice(0, 7) : "?");
        if (k === g.key) nMatch++;
      });
      return "<tr><td>" + nm + "</td><td>" + nMatch + '</td><td class="num c-sm-hide">' + g.n + '</td><td class="num c-sm-hide">' + fmt(g.stake) +
        '</td><td class="num ' + cls(g.pnl) + '">' + money(g.pnl) + '</td><td class="num c-sm-hide">' + (c ? "−" + fmt(c) : "—") +
        '</td><td class="num ' + cls(net) + '"><b>' + money(net) + '</b></td><td class="num">' + fmt(g.roi, 1) + "%</td></tr>";
    }).join("");

    h.push('<div class="tbwrap"><table><thead><tr><th>周期</th><th>场次</th><th class="c-sm-hide">注数</th>' +
      '<th class="c-sm-hide">投入</th><th>盈亏</th><th class="c-sm-hide">料单</th><th>净盈亏</th><th>ROI</th></tr></thead><tbody>' +
      body + "</tbody><tfoot><tr class=\"tot\"><td>合计</td><td>" + D().matches.length + '</td><td class="num c-sm-hide">' + tot.n +
      '</td><td class="num c-sm-hide">' + fmt(tot.stake) + '</td><td class="num ' + cls(tot.pnl) + '">' + money(tot.pnl) +
      '</td><td class="num c-sm-hide">−' + fmt(tot.cost) + '</td><td class="num ' + cls(tot.pnl - tot.cost) + '">' + money(tot.pnl - tot.cost) +
      '</td><td class="num">' + fmt(tot.stake ? tot.pnl / tot.stake * 100 : 0, 1) + "%</td></tr></tfoot></table></div>");
    h.push('<div class="note" style="font-size:11.5px">「盈亏」= 盘口盈亏；「净盈亏」= 盈亏 − 料单成本。</div>');

    // 周期画像
    h.push('<div class="sec">周期画像</div>');
    var byMk = Engine.groupBy(rows, function (r) { return r.market; }).sort(function (a, b) { return b.pnl - a.pnl; });
    var best = byMk[0], worst = byMk[byMk.length - 1];
    if (best) h.push('<div class="note">最赚玩法：<b>' + best.key + "</b>（" + best.n + " 笔，" + money(best.pnl) + "）");
    if (worst && worst !== best) h.push(" ｜ 最亏玩法：<b>" + worst.key + "</b>（" + worst.n + " 笔，" + money(worst.pnl) + "）</div>");

    var winDays = groups.filter(function (g) { return g.pnl > 0; }).length;
    var loseDays = groups.filter(function (g) { return g.pnl < 0; }).length;
    h.push('<div class="note num">盈利周期 <b class="win">' + winDays + "</b> / 亏损周期 <b class=\"lose\">" + loseDays +
      "</b>，胜率 " + fmt(groups.length ? winDays / groups.length * 100 : 0, 0) + "%</div>");

    $("#v-sum").innerHTML = h.join("");
    $("#sumMode").onchange = function () { sumMode = this.value; viewSum(); };
  }

  // ---------- 建议 ----------
  function viewAdv() {
    var rows = allRows();
    var a = Engine.agg(rows);
    var cost = 0, costN = 0;
    D().matches.forEach(function (m) { var t = Number(m.tipCost) || 0; cost += t; if (t) costN++; });
    var net = a.pnl - cost;

    var byMk = Engine.groupBy(rows, function (r) { return r.market; });
    var byOdds = Engine.groupBy(rows, function (r) {
      var o = r.odds;
      if (!isFinite(o)) return "未知";
      if (o < 0.6) return "赔率 <0.60";
      if (o < 0.8) return "0.60–0.80";
      if (o < 1.0) return "0.80–1.00";
      if (o < 1.5) return "1.00–1.50";
      if (o < 3.0) return "1.50–3.00";
      return "≥3.00";
    });
    var byStake = Engine.groupBy(rows.filter(function (r) { return r.stake > 0; }), function (r) { return r.stake + " 元"; });
    var byLg = Engine.groupBy(rows, function (r) { return r.league || "未标"; });
    var byLive = Engine.groupBy(rows, function (r) { return r.live ? "滚球入场" : "赛前下单"; });

    var h = [];
    h.push('<div class="kpis">');
    h.push(kpi("记录盈亏", money(a.pnl), a.n + " 笔", cls(a.pnl)));
    h.push(kpi("料单成本", "−" + fmt(cost), costN + " 次", "lose"));
    h.push(kpi("净盈亏", money(net), "毛利 − 料单", cls(net)));
    h.push(kpi("是否赚钱", net > 0 ? "是" : "否", "净盈亏 / 投入 " + fmt(a.stake), net > 0 ? "win" : "lose"));
    h.push("</div>");

    var ins = [];

    // 1 玩法
    var mks = byMk.slice().sort(function (x, y) { return y.pnl - x.pnl; });
    var top = mks[0], bot = mks[mks.length - 1];
    if (top) ins.push({
      k: "good", t: "钱主要赚在哪几种玩法",
      p: mks.filter(function (x) { return x.pnl > 0; }).slice(0, 3).map(function (x) {
        return "<b class='hl'>" + x.key + "</b> " + x.n + " 笔、" + fmt(x.stake) + " 元投入、" +
          money(x.pnl) + "（ROI " + fmt(x.roi, 1) + "%）";
      }).join("；") || "没有稳定盈利的玩法。",
      d: top ? "把仓位往「" + top.key + "」集中，把「" + (bot ? bot.key : "") + "」这类负期望玩法的注额压到零。" : ""
    });
    // 2 亏在哪（只统计样本够厚的，两个 2 笔的算噪音）
    var bad = mks.filter(function (x) { return x.pnl < 0 && x.n >= 10; });
    var tiny = mks.filter(function (x) { return x.pnl < 0 && x.n < 10; });
    if (bad.length) {
      var lossSum = bad.reduce(function (s, x) { return s + x.pnl; }, 0);
      ins.push({
        k: "bad", t: "亏损集中在这几类，且不是运气问题",
        p: bad.map(function (x) { return "<b class='hl'>" + x.key + "</b> " + x.n + " 笔、" + fmt(x.stake) +
          " 元，" + money(x.pnl) + "（ROI " + fmt(x.roi, 1) + "%）"; }).join("；") +
          "。合计 " + money(lossSum) + "。" +
          (tiny.length ? "另有 " + tiny.map(function (x) { return x.key + " " + x.n + " 笔"; }).join("、") + " 是小额试错，先不动。" : ""),
        d: "这几类先停掉，或者每类每期只给一笔 200 元的上限做「试错额度」，不再用正经仓位。"
      });
    }
    // 3 赔率甜区
    var ods = byOdds.slice().sort(function (x, y) { return y.roi - x.roi; });
    var bestO = ods[0], worstO = ods[ods.length - 1];
    if (bestO && ods.length > 1) {
      ins.push({
        k: "", t: "你的赔率甜区在 " + bestO.key,
        p: ods.map(function (x) { return x.key + " " + x.n + " 笔 " + fmt(x.roi, 1) + "%"; }).join(" ｜ ") +
          "。甜区 " + bestO.key + " 贡献 " + money(bestO.pnl) + "；" +
          (worstO ? worstO.key + " 亏掉 " + fmt(-worstO.pnl) + " 元" : "") + "。",
        d: "下注前先看赔率：落在 " + bestO.key + " 的正常下，落在 " + (worstO ? worstO.key : "") + " 的一律减半或跳过。"
      });
    }
    // 4 注额纪律（要求样本量 ≥20 才算结论，避免小样本骗人）
    var stksAll = byStake.filter(function (x) { return x.n >= 5; }).sort(function (x, y) { return x.n - y.n; });
    var stksBig = byStake.filter(function (x) { return x.n >= 40; }).sort(function (x, y) { return x.roi - y.roi; });
    if (stksAll.length > 1) {
      var bigWorst = stksBig.length ? stksBig[0] : null;
      var bigBest = stksBig.length ? stksBig[stksBig.length - 1] : null;
      var smallBad = stksAll.filter(function (x) { return x.n < 40 && x.roi < 0; }).sort(function (x, y) { return x.roi - y.roi; });
      ins.push({
        k: bigWorst && bigWorst.roi < 0 ? "warn" : "", t: "注额和回报不成正比，小注最差",
        p: stksAll.map(function (x) { return x.key + " " + x.n + " 笔 ROI " + fmt(x.roi, 1) + "%"; }).join(" ｜ ") + "。" +
          (bigWorst ? "样本够厚的档里，<b class='hl'>" + bigWorst.key + "</b> 最差（" + fmt(bigWorst.roi, 1) + "%），" : "") +
          (bigBest ? "<b class='hl'>" + bigBest.key + "</b> 最好（" + fmt(bigBest.roi, 1) + "%）。" : "") +
          (smallBad.length ? "另外 " + smallBad.map(function (x) { return x.key + "（" + x.n + " 笔 " + fmt(x.roi, 1) + "%）"; }).join("、") + " 这类小额随手单基本是白送（样本小，当参考）。" : ""),
        d: "固定注额：从样本够厚的赚钱档里选一档当唯一注额，" + (bigBest ? "建议 " + bigBest.key + "，" : "") +
          "把 200 元以下的「顺手买」直接取消；每场最多 1~2 笔。"
      });
    }
    // 5 滚球
    if (byLive.length > 1) {
      var lv = byLive.filter(function (x) { return x.key === "滚球入场"; })[0];
      ins.push({
        k: lv && lv.pnl < 0 ? "warn" : "", t: "滚球入场的账比账面更差",
        p: byLive.map(function (x) { return "<b class='hl'>" + x.key + "</b> " + x.n + " 笔、" + fmt(x.stake) +
          " 元、" + money(x.pnl) + "（ROI " + fmt(x.roi, 1) + "%）"; }).join("；") + "。" +
          (lv ? "滚球占了 " + fmt(lv.stake / Math.max(1, a.stake) * 100, 1) + "% 的投入，回报却是 " + fmt(lv.roi, 1) + "%。" : ""),
        d: "先把滚球停两周，只做赛前；两周后对比一下，滚球如果没有明显正回报就不要恢复。"
      });
    }
    // 6 料单
    if (cost > 0) {
      ins.push({
        k: cost / Math.max(1, Math.abs(a.pnl)) > 0.1 ? "warn" : "", t: "料单成本吃掉了 " + fmt(cost / Math.max(1, Math.abs(a.pnl)) * 100, 1) + "% 的利润",
        p: "共 " + costN + " 次、合计 " + fmt(cost) + " 元，相当于 " + fmt(cost / Math.max(1, costN), 0) + " 元/次。",
        d: "料单是固定成本，不随盈亏浮动。建议记在「料单」栏里单独统计，别混进盈亏；连续两期料单钱没跑赢自己判断，就停掉。"
      });
    }
    // 7 赛事（只用在「确定」的赛事上：同一联赛内战，不掺推定值）
    var rowsHi = rows.filter(function (r) { return (r.match.leagueConf || "高") === "高"; });
    var byLgHi = Engine.groupBy(rowsHi, function (r) { return r.league || "未标"; });
    var lgs = byLgHi.filter(function (x) { return x.n >= 25; }).sort(function (x, y) { return y.pnl - x.pnl; });
    if (lgs.length > 1) {
      ins.push({
        k: "", t: "赛事维度：熟不熟比准不准更影响收益",
        p: "只看赛事标签确定的 " + rowsHi.length + " 笔（样本≥25 才列）：" +
          lgs.slice(0, 3).map(function (x) { return "<b class='hl'>" + x.key + "</b> " + x.n + " 笔 " + fmt(x.roi, 1) + "%"; }).join(" ｜ ") +
          "；最差 " + lgs[lgs.length - 1].key + " " + lgs[lgs.length - 1].n + " 笔 " + fmt(lgs[lgs.length - 1].roi, 1) + "%。",
        d: "注额按赛事加权：回报最好的两个赛事给满仓，最差的只做小额或不做。欧战那批赛事标签是推定的，先在录入里核实再用。"
      });
    }
    // 8 数据核对
    var diffList = [];
    rows.forEach(function (r) {
      if (r.src === "manual") return;
      var au = Engine.autoSettle(r.match, r.leg);
      if (au.pnl != null && Math.abs(au.pnl - r.pnl) > 0.25) diffList.push({ r: r, au: au });
    });
    if (diffList.length) {
      var delta = diffList.reduce(function (s, x) { return s + (x.au.pnl - x.r.pnl); }, 0);
      ins.push({
        k: "warn", t: "有 " + diffList.length + " 笔盈亏和规则结算对不上",
        p: "按「赛果 + 让球/大小球」重算，这 " + diffList.length + " 笔合计差 " + money(delta) +
          "。最大的一笔是 #" + (diffList.sort(function (x, y) { return Math.abs(y.au.pnl - y.r.pnl) - Math.abs(x.au.pnl - x.r.pnl); })[0].r.match.seq) + "。",
        d: "到「数据 → 盈亏重算」里看逐笔差异，确认后一键按规则修正。盈亏是唯一真指标，这笔账必须平。"
      });
    }

    ins.forEach(function (x) {
      h.push('<div class="ins ' + (x.k || "") + '"><h3>' + esc(x.t) + "</h3><p>" + x.p + "</p>" +
        (x.d ? '<div class="do">' + esc(x.d) + "</div>" : "") + "</div>");
    });

    // 下注额度建议
    var bank = Number(D().settings.bankroll) || 0;
    h.push('<div class="sec">下注额度参考</div>');
    h.push('<div class="ins"><h3>按你现在的资金管纪律怎么下</h3><p>' +
      (bank > 0
        ? "按本金 <b class='hl'>" + fmt(bank) + "</b> 元、单注 1%~2% 的凯利上限：常规单 <b class='hl'>" +
          fmt(bank * 0.01) + " ~ " + fmt(bank * 0.02) + "</b> 元。"
        : "还没填本金，先到「数据 → 本金设置」填一个数，这里会自动按它算你的单注上限。") +
      ' 以你目前的投入规模（平均 ' + fmt(a.stake / Math.max(1, a.n), 0) + " 元/笔），" +
      (a.stake / Math.max(1, a.n) > bank * 0.02 && bank > 0 ? "<b class='hl'>平均注额已超过 2% 上限</b>，波动会吃掉你。" : "仓位还算健康。") +
      "</p><div class=\"do\">规则：单注 ≤ 本金 2%；同期未结算注单合计 ≤ 本金 10%；连亏 3 期当周停止加仓。</div></div>");

    $("#v-adv").innerHTML = h.join("");
  }

  // ---------- 从真实赛程选比赛（嵌在「新增比赛」弹层里） ----------

    ["por.1", "葡超"], ["ned.1", "荷甲"], ["tur.1", "土超"], ["sco.1", "苏超"],
    ["uefa.champions", "欧冠"], ["uefa.europa", "欧联"], ["uefa.europa.conf", "欧协联"],
    ["jpn.1", "日职J1"], ["kor.1", "K联赛"], ["aus.1", "澳超"], ["ksa.1", "沙特联"], ["usa.1", "美职联"]
  ];
  var pick = { date: "", leagues: null, events: [], loading: false, err: "", msg: "" };

  function pickInit() {
    if (!pick.date) pick.date = Engine.ymd(new Date());
    if (!pick.leagues) {
      pick.leagues = {};
      ["eng.1", "esp.1", "ger.1", "ita.1", "fra.1", "uefa.champions", "uefa.europa", "uefa.europa.conf"]

  function pickerBlockHtml() {
    pickInit();
    var h = [];

    h.push('<div class="bar"><input type="date" id="pkDate" value="' + esc(pick.date) + '" style="flex:1 1 auto;min-width:0">' +
      '<button class="btn sm primary" id="pkGo" style="flex:0 0 auto">' + (pick.loading ? "拉取中…" : "拉取赛程") + '</button></div>');
    h.push('<div class="pk-chips">');

      h.push('<button class="pk-chip' + (pick.leagues[x[0]] ? " on" : "") + '" data-lg="' + x[0] + '">' + x[1] + "</button>");
    });

  function pickerListHtml() {
    if (pick.loading) return '<div class="note">拉取中…</div>';
    if (pick.err) return '<div class="note warn">' + esc(pick.err) + "</div>";
    if (!pick.events.length) return pick.msg ? '<div class="note">' + esc(pick.msg) + "</div>" : "";
    var out = ['<div class="note" style="margin:2px 0 6px">点一场就自动填进下面（共 ' + pick.events.length + " 场）</div>"];
    pick.events.slice(0, 40).forEach(function (e, i) {
      out.push('<div class="pk-row" data-pi="' + i + '">' +
        '<div class="mid"><div class="t1">' + esc(e.homeCN || e.home) + " vs " + esc(e.awayCN || e.away) + "</div>" +
        '<div class="t2">' + esc(e.leagueName) + " · " + esc(e.kick) + (e.completed ? " · 已结束" : " · 未开赛") +
        ((e.homeCN && e.awayCN) ? "" : " · 队名未汉化") + "</div></div>" +
        '<div class="sc num">' + (e.score ? esc(e.score) : "—") + "</div></div>");
    });
    return out.join("");
  }

  function bindPicker() {
    var d = $("#pkDate");
    if (!d) return;
    d.onchange = function () { pick.date = this.value; pick.events = []; pick.msg = ""; pick.err = ""; refreshPicker(); };
    $("#pkGo").onclick = function () {
      var slugs = Object.keys(pick.leagues);
      if (!slugs.length) { pick.err = "先勾选至少一个赛事"; refreshPicker(); return; }
      pick.loading = true; pick.err = ""; pick.msg = ""; pick.events = [];
      refreshPicker();
      fetch("/api/fx?date=" + encodeURIComponent(pick.date) + "&leagues=" + encodeURIComponent(slugs.join(",")),
        { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          pick.loading = false;
          if (!j || !j.ok) { pick.err = (j && j.error) || "拉取失败"; refreshPicker(); return; }
          pick.events = j.events || [];
          pick.msg = "已拉取 " + pick.events.length + " 场（北京时间）";
          refreshPicker();
        })
        .catch(function (e) { pick.loading = false; pick.err = "拉取失败：" + e.message; refreshPicker(); });
    };
    $$("#pkChips, .pk-chips").forEach(function (box) {
      if (!box) return;
    });
    $$(".pk-chip").forEach(function (b) {
      b.onclick = function () {
        var k = this.dataset.lg;
        if (pick.leagues[k]) delete pick.leagues[k]; else pick.leagues[k] = 1;
        refreshPicker();
      };
    });
    $$("#pkList .pk-row").forEach(function (r) {
      r.onclick = function () {
        var e = pick.events[+this.dataset.pi];
        if (e) pickCommit(e);
      };
    });
  }

  // 点一场 = 当场建好记录（日期/时间/赛事/主客/比分全自动），然后直接进注单页
  function pickCommit(e) {
    var home = e.homeCN || e.home, away = e.awayCN || e.away;
    var same = D().matches.filter(function (x) {
      return x.date === pick.date && x.home === home && x.away === away;
    })[0];
    var target = same;
    if (!target) {
      var id = "m" + Math.random().toString(36).slice(2, 9);
      target = {
        id: id, seq: Store.nextSeq(), date: pick.date, time: e.kick, timeSrc: "已核实",
        league: e.leagueName, leagueConf: "高", home: home, away: away,
        score: e.score || "", ht: "", corners: null, cards: null,
        note: "", tipCost: 0, settled: !!e.score,
        legs: [{ id: id + "_b1", bet: "", odds: null, stake: null, pnl: null, note: "" }]
      };
      D().matches.push(target);
      Store.save();
    }
    editing = null;
    openEdit(target.id);
    setTimeout(function () {
      var b = $("#sheetB [data-f='bet']");
      if (b) b.focus();
    }, 120);
    toast(same ? "这场已在库里，直接补注单" : "已录入 " + home + " vs " + away + "，填下注即可");
  }

  function refreshPicker() {
    var box = $("#pkList");
    if (box) box.innerHTML = pickerListHtml();
    var g = $("#pkGo");
    if (g) g.textContent = pick.loading ? "拉取中…" : "拉取赛程";
    bindPicker();
  }

  // ---------- 同步赛果（自动回填比分并重算盈亏） ----------
  function syncResults() {
    if (Store.mode !== "server") { toast("同步赛果需要本机服务（启动服务器.bat）"); return; }
    var pend = D().matches.filter(function (m) { return !m.score; });
    if (!pend.length) { toast("没有待填赛果的场次"); return; }
    var byDate = {};
    pend.forEach(function (m) { (byDate[m.date] = byDate[m.date] || []).push(m); });
    var dates = Object.keys(byDate).sort();
    var filled = 0, done = 0;
    toast("正在核对 " + dates.length + " 个日期…");
    (function step() {
      if (done >= dates.length) {
        Store.save();
        render();
        toast(filled ? "已回填 " + filled + " 场赛果，盈亏已重算" : "没有查到新的赛果");
        return;
      }
      var d = dates[done++];
      fetch("/api/results?date=" + encodeURIComponent(d), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) {
            var idx = {};
            (j.events || []).forEach(function (e) {
              if (e.homeCN && e.awayCN) idx[e.homeCN + "|" + e.awayCN] = e.score;
            });
            byDate[d].forEach(function (m) {
              var s = idx[m.home + "|" + m.away];
              if (s) { m.score = s; m.settled = true; filled++; }
            });
          }
        })
        .catch(function () {})
        .then(step);
    })();
  }

  // ---------- 一键结算（按日期一刀切） ----------
  function openSettleSheet() {
    var today = Engine.ymd(new Date());
    var nSettled = 0, nOpen = 0, nScored = 0;
    D().matches.forEach(function (m) {
      if (m.settled) nSettled++;
      if (!m.score) nOpen++;
      if (m.settled && m.score) nScored++;
    });
    $("#sheetT").textContent = "一键结算";
    $("#sheetB").innerHTML =
      '<div class="note">按日期一刀切：这一天（含）之前的全部标为已结算，之后的全部标为未结算。' +
      '没有比分的场次不会被标成已结算。</div>' +
      '<div class="fg one"><div><label>结算截止日期</label>' +
      '<input type="date" id="stDate" value="' + esc(today) + '"></div></div>' +
      '<div class="note num">当前：已结算 ' + nSettled + " 场、未填赛果 " + nOpen + " 场</div>";
    $("#sheetF").innerHTML =
      '<button class="btn ghost" id="stCancel">取消</button>' +
      '<button class="btn" id="stAll">全部标已结算</button>' +
      '<button class="btn primary" id="stApply">按此日期结算</button>';
    $("#stCancel").onclick = closeSheet;
    $("#stAll").onclick = function () {
      var n = 0;
      undoBegin();
      D().matches.forEach(function (m) {
        if (m.score && !m.settled) { m.settled = true; n++; }
      });
      undoCommit("全部标已结算");
      Store.save(); closeSheet(); render();
      toast("已结算 " + n + " 场" + (n ? "" : "（没有可结算的）"));
    };
    $("#stApply").onclick = function () {
      var cut = $("#stDate").value;
      if (!cut) { toast("先选一个日期"); return; }
      var a = 0, b = 0;
      undoBegin();
      D().matches.forEach(function (m) {
        var want = m.date <= cut ? !!m.score : false;
        if (m.settled !== want) { m.settled = want; want ? a++ : b++; }
      });
      undoCommit("按 " + cut + " 一键结算");
      Store.save(); closeSheet(); render();
      toast("已结算 " + a + " 场、取消结算 " + b + " 场");
    };
    openSheet();
  }

  function row(k, v, extra) {
    return '<div class="row"><span class="k">' + k + '</span><span class="sp"></span><span class="num">' + esc(v) + "</span>" +
      (extra ? " " + extra : "") + "</div>";

  // ---------- 导出 ----------
  // mode: "raw" = 完全原表；"time" = 原表 + 日期后插一列开赛时间；"full" = 再加赛事
  // 列宽/行高/字体/边框/合并/盈亏配色 均照原表（E:\足球竞彩详情表.et 实测值）
  var EXPORT_HEAD = {
    raw: ["序号", "日期", "比赛", "下注内容", "赔率", "下注金额", "盈亏", "赛果", "备注", "是否结算"],
    time: ["序号", "日期", "开赛时间", "比赛", "下注内容", "赔率", "下注金额", "盈亏", "赛果", "备注", "是否结算"],
    full: ["序号", "日期", "赛事", "开赛时间", "比赛", "下注内容", "赔率", "下注金额", "盈亏", "赛果", "备注", "是否结算"]
  };
  // 原表实测列宽：A9 B16.25 C34.75 D22.83203125 E16.83203125 F9 G9.4140625 H12.6640625 I16.5 J13.75 K9(图例)
  var W_DATE = 16.25, W_MATCH = 34.75, W_BET = 22.83203125, W_ODDS = 16.83203125;
  var W_STAKE = 9, W_PNL = 9.4140625, W_SCORE = 12.6640625, W_NOTE = 16.5, W_SETTLED = 13.75, W_SEQ = 9;
  var W_TIME = 12, W_LEAGUE = 14, W_LEGEND = 9;
  function exportCols(mode) {
    var c = [W_SEQ, W_DATE];
    if (mode === "full") c.push(W_LEAGUE);
    if (mode !== "raw") c.push(W_TIME);
    c.push(W_MATCH, W_BET, W_ODDS, W_STAKE, W_PNL, W_SCORE, W_NOTE, W_SETTLED, W_LEGEND);
    return c;
  }
  // 样式索引见 XL.STYLES 注释
  var ST_TEXT = 3, ST_TEXT_AT = 4, ST_NUM = 5, ST_PNL_G = 6, ST_PNL_R = 7, ST_PNL_Y = 8, ST_BLANK = 9, ST_ODDS = 13;

  function buildRows(mode) {
    mode = EXPORT_HEAD[mode] ? mode : "time";
    var ms = sortedAsc();
    var head = EXPORT_HEAD[mode];
    var nData = head.length;
    var legendCol = nData;                        // 图例列（原表的「盈利/亏损/走水」）
    var ix = function (name) { return head.indexOf(name); };
    var cSeq = ix("序号"), cDate = ix("日期"), cTime = ix("开赛时间"),
        cMatch = ix("比赛"), cBet = ix("下注内容"), cOdds = ix("赔率"), cStake = ix("下注金额"),
        cPnl = ix("盈亏"), cScore = ix("赛果"), cNote = ix("备注"), cSettled = ix("是否结算");

    var rows = [], heights = [], merges = [];
    var blank = function (s) { return { v: "", s: s }; };

    // 第 1 行：标题（合并 A1:最后一列数据列）+ 图例「盈利」
    var r1 = [];
    for (var i = 0; i < nData; i++) r1.push(blank(1));
    r1[0] = { v: "足球竞彩详情表", t: "s", s: 1 };
    r1[legendCol] = { v: "盈利", t: "s", s: 10 };
    rows.push(r1); heights.push(50);
    merges.push("A1:" + XL.colName(nData - 1) + "1");

    // 第 2 行：表头（原表表头是跨第 2~3 行合并的，第 3 行就是表头的下半截）+ 图例「亏损」
    var r2 = head.map(function (t) { return { v: t, t: "s", s: 2 }; });
    r2[legendCol] = { v: "亏损", t: "s", s: 11 };
    rows.push(r2); heights.push(50);
    for (var hc = 0; hc < nData; hc++) {
      var HL = XL.colName(hc);
      merges.push(HL + "2:" + HL + "3");
    }

    // 第 3 行：只放图例「走水」，其余列已被表头合并覆盖
    var r3 = new Array(nData + 1);
    for (var j = 0; j <= nData; j++) r3[j] = null;
    r3[legendCol] = { v: "走水", t: "s", s: 12 };
    rows.push(r3); heights.push(50);

    // 数据行：第 4 行起
    var totalPnl = 0, totalStake = 0, excelRow = 4;
    var dateGroups = [];                          // 日期合并用
    ms.forEach(function (m) {
      var startRow = excelRow;
      m.legs.forEach(function (l, i) {
        var r = Engine.legPnl(m, l);
        totalPnl += r.pnl; totalStake += Number(l.stake) || 0;
        var first = i === 0;
        var cells = new Array(nData + 1);
        for (var k = 0; k <= nData; k++) cells[k] = blank(ST_TEXT);
        cells[cSeq] = first ? { v: m.seq, t: "n", s: ST_NUM } : blank(ST_NUM);
        cells[cDate] = first ? { v: fmtDate(m.date), t: "s", s: ST_TEXT } : blank(ST_TEXT);
        if (cTime >= 0) cells[cTime] = first ? { v: m.time || "", t: "s", s: ST_TEXT } : blank(ST_TEXT);
        if (ix("赛事") >= 0) cells[ix("赛事")] = first ? { v: m.league || "", t: "s", s: ST_TEXT } : blank(ST_TEXT);
        cells[cMatch] = first ? { v: m.home + "vs" + m.away, t: "s", s: ST_TEXT } : blank(ST_TEXT);
        cells[cBet] = { v: l.bet || "", t: "s", s: ST_TEXT };
        cells[cOdds] = (l.odds == null) ? blank(ST_ODDS) : { v: Number(l.odds), t: "n", s: ST_ODDS };
        cells[cStake] = (l.stake == null) ? blank(ST_NUM) : { v: Number(l.stake), t: "n", s: ST_NUM };
        if (m.score) {
          var p = Math.round(r.pnl * 100) / 100;
          cells[cPnl] = { v: p, t: "n", s: p > 0.004 ? ST_PNL_G : (p < -0.004 ? ST_PNL_R : ST_PNL_Y) };
        } else {
          cells[cPnl] = blank(ST_PNL_Y);
        }
        cells[cScore] = first ? { v: m.score || "", t: "s", s: ST_TEXT_AT } : blank(ST_TEXT_AT);
        cells[cNote] = first ? {
          v: (m.note || "") + (Number(m.tipCost) ? (m.note ? " / " : "") + "料单" + m.tipCost + "元" : ""),
          t: "s", s: ST_TEXT
        } : blank(ST_TEXT);
        cells[cSettled] = first ? { v: m.settled ? "是" : "否", t: "s", s: ST_TEXT } : blank(ST_TEXT);
        rows.push(cells); heights.push(30);
        excelRow++;
      });
      var endRow = excelRow - 1;
      // 一场多注：序号/开赛时间/比赛/赛果/备注/是否结算 合并
      if (endRow > startRow) {
        [cSeq, cTime, cMatch, cScore, cNote, cSettled].forEach(function (ci) {
          if (ci == null || ci < 0) return;
          var L = XL.colName(ci);
          merges.push(L + startRow + ":" + L + endRow);
        });
      }
      // 同一天的多场：日期合并（原表就是这么做的）
      var last = dateGroups[dateGroups.length - 1];
      if (last && last.date === m.date) { last.end = endRow; }
      else dateGroups.push({ date: m.date, start: startRow, end: endRow });
    });
    dateGroups.forEach(function (g) {
      if (g.end > g.start) {
        var L = XL.colName(cDate);
        merges.push(L + g.start + ":" + L + g.end);
      }
    });

    return { rows: rows, heights: heights, merges: merges, pnl: totalPnl, stake: totalStake,
             autoFilter: "A2:" + XL.colName(nData - 1) + (rows.length) };
  }
  function fmtDate(d) {
    if (!d) return "";
    var p = d.split("-");
    return (+p[0]) + "." + (+p[1]) + "." + (+p[2]);
  }
  function exportXlsx(mode) {
    try {
      mode = EXPORT_HEAD[mode] ? mode : "time";
      var b = buildRows(mode);
      var u8 = XL.build("足球竞彩详情表", b.rows, {
        cols: exportCols(mode),
        freeze: 3,
        merges: b.merges,
        rowHeights: b.heights,
        autoFilter: b.autoFilter,
        defH: 15
      });
      var blob = new Blob([u8], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var tag = mode === "full" ? "_含赛事" : (mode === "raw" ? "_原表" : "");
      var name = "足球竞彩详情表_" + Engine.ymd(new Date()).replace(/-/g, "") + tag + ".xlsx";
      download(blob, name);
      toast("已导出 " + name);
    } catch (e) {
      toast("导出失败：" + e.message);
      console.error(e);
    }
  }
  function exportJson() {
    var blob = new Blob([JSON.stringify(Store.plain(D()), null, 1)], { type: "application/json" });
    download(blob, "足球竞彩备份_" + Engine.ymd(new Date()) + ".json");
    toast("已导出 JSON 备份");
  }
  function download(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  }
  function importJson(e) {
    var f = this.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var d = JSON.parse(rd.result);
        if (!d || !Array.isArray(d.matches)) throw new Error("不是本软件的备份文件");
        if (!confirm("导入将覆盖当前 " + D().matches.length + " 场记录，确定？")) return;
        Store.data = Store.normalize(d);
        Store.save(true); render(); toast("已导入 " + Store.data.matches.length + " 场");
      } catch (x) { toast("导入失败：" + x.message); }
    };
    rd.readAsText(f);
    e.target.value = "";
  }

  // ---------- 批量：开赛时间 ----------
  function openLeagueSheet() {
    var map = {};
    D().matches.forEach(function (m) {
      if (!m.league) return;
      var e = map[m.league] || (map[m.league] = { n: 0, times: {}, guess: 0 });
      e.n++;
      e.times[m.time || "—"] = (e.times[m.time || "—"] || 0) + 1;
      if (m.timeSrc === "推定") e.guess++;
    });
    var keys = Object.keys(map).sort(function (a, b) { return map[b].n - map[a].n; });
    $("#sheetT").textContent = "按赛事批量设开赛时间";
    $("#sheetB").innerHTML = '<div class="note">当前时间都是按赛事惯例填的推定值。填上你确认的时间后点「应用」，该赛事所有场次一起改。</div>' +
      keys.map(function (k) {
        var e = map[k];
        var cur = Object.keys(e.times).sort(function (a, b) { return e.times[b] - e.times[a]; })[0];
        return '<div class="row" style="margin-bottom:7px"><div><div>' + esc(k) + '</div>' +
          '<div class="k num">' + e.n + " 场 · 现为 " + esc(cur) + (e.guess ? " · 推定 " + e.guess : "") + "</div></div>" +
          '<div class="sp"></div><input type="time" class="lgTime" data-lg="' + esc(k) + '" value="' +
          (cur === "—" ? "" : cur) + '" style="width:118px"></div>';
      }).join("");
    $("#sheetF").innerHTML = '<button class="btn ghost" id="lgCancel">取消</button><button class="btn primary" id="lgApply">应用</button>';
    $("#lgCancel").onclick = closeSheet;
    $("#lgApply").onclick = function () {
      var n = 0;
      $$(".lgTime").forEach(function (inp) {
        var lg = inp.dataset.lg, v = inp.value;
        if (!v) return;
        D().matches.forEach(function (m) { if (m.league === lg) { m.time = v; m.timeSrc = "已核实"; n++; } });
      });
      Store.save(); closeSheet(); render(); toast("已更新 " + n + " 场");
    };
    openSheet();
  }

  // ---------- 批量：盈亏重算 ----------
  function openFixSheet() {
    var diffs = [];
    D().matches.forEach(function (m) {
      m.legs.forEach(function (l) {
        var a = Engine.autoSettle(m, l);
        if (a.pnl == null) return;
        var cur = Engine.legPnl(m, l);
        if (l.manual != null && l.manual !== "") return;
        if (Math.abs(a.pnl - cur.pnl) > 0.25) {
          diffs.push({ m: m, l: l, rec: cur.pnl, auto: a.pnl, code: a.code });
        }
      });
    });
    $("#sheetT").textContent = "盈亏重算核对";
    if (!diffs.length) {
      $("#sheetB").innerHTML = '<div class="empty"><h3>没有差异</h3><p>所有注单的盈亏都和「赛果 + 盘口」算出来的一致。</p></div>';
      $("#sheetF").innerHTML = '<button class="btn primary" id="fxClose">知道了</button>';
      $("#fxClose").onclick = closeSheet;
      openSheet(); return;
    }
    var delta = diffs.reduce(function (s, d) { return s + (d.auto - d.rec); }, 0);
    $("#sheetB").innerHTML = '<div class="note num">共 <b>' + diffs.length + "</b> 笔对不上，合计差 <b class=\"" + cls(delta) + "\">" +
      money(delta) + "</b>。下表「记录的」是你表里的数，「规则算的」是按赛果+盘口重算的。</div>" +
      '<div class="tbwrap"><table><thead><tr><th>比赛</th><th>比分</th><th>下注</th><th>记录</th><th>规则</th><th>差</th></tr></thead><tbody>' +
      diffs.map(function (d, i) {
        return "<tr><td>#" + d.m.seq + " " + esc(d.m.home) + " <span style='color:var(--muted)'>vs</span> " + esc(d.m.away) +
          "</td><td class='num'>" + esc(d.m.score) + "</td><td>" + esc(d.l.bet) +
          "</td><td class='num " + cls(d.rec) + "'>" + money(d.rec) +
          "</td><td class='num " + cls(d.auto) + "'>" + money(d.auto) +
          "</td><td class='num'>" + money(d.auto - d.rec) + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<div class="note warn">注意：如果这场的比分或玩法本身记错了，改回来以后差异会自己消失，不要盲目点修正。</div>';
    $("#sheetF").innerHTML = '<button class="btn ghost" id="fxNo">先不改</button><button class="btn primary" id="fxYes">全部按规则修正</button>';
    document.querySelector("#fxNo").onclick = closeSheet;
    document.querySelector("#fxYes").onclick = function () {
      diffs.forEach(function (d) { d.l.manual = Math.round(d.auto * 100) / 100; });
      Store.save(); closeSheet(); render(); toast("已修正 " + diffs.length + " 笔");
    };
    openSheet();
  }

  // ---------- 路由 ----------
  function render() {
    renderHeader();
    renderConflict();
    if (view === "entry") viewEntry();
    else if (view === "curve") viewCurve();
    else if (view === "sum") viewSum();
    else if (view === "adv") viewAdv();
    else viewData();
  }
  function switchTo(v) {
    view = v;
    ["entry", "curve", "sum", "adv", "data"].forEach(function (k) {
      var el = $("#v-" + k);
      if (el) el.classList.toggle("hide", k !== v);
    });
    try { if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); } catch (e) {}
    render();
    window.scrollTo(0, 0);
  }

  function boot(data) {
    Store.data = data;
    ensureSeqUnique();
    renderHeader();
    $("#tabs").onclick = function (e) {
      var b = e.target.closest("button[data-t]");
      if (!b) return;
      switchTo(b.dataset.t);
    };
    $("#mask").onclick = closeSheet;
    $("#sheetX").onclick = closeSheet;
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeSheet();
      // Ctrl+Z / Cmd+Z 撤回上一步（在输入框里时交给浏览器自己处理）
      var tag = (e.target && e.target.tagName || "").toLowerCase();
      if ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z") &&
          tag !== "input" && tag !== "textarea") {
        e.preventDefault();
        undoRun();
      }
    });
    window.addEventListener("resize", function () {
      if (view === "curve") { clearTimeout(window._rz); window._rz = setTimeout(function () { viewCurve(); }, 180); }
    });
    var want = (location.hash || "").replace("#", "");
    switchTo(["entry", "curve", "sum", "adv", "data"].indexOf(want) >= 0 ? want : "entry");
    renderConflict();
    startSync();
    window.addEventListener("hashchange", function () {
      var w = (location.hash || "").replace("#", "");
      if (["entry", "curve", "sum", "adv", "data"].indexOf(w) >= 0 && w !== view) switchTo(w);
    });
  }

  return { boot: boot, render: render, syncSave: syncSave, toast: toast, viewEntry: viewEntry,
           renderConflict: renderConflict, startSync: startSync };
})();
</script>

<script>
(function () {
  Store.load().then(function (d) {
    UI.boot(d);
    if (Store.mode === "server") Store.flush();
  }).catch(function (e) {
    document.querySelector("#v-entry").innerHTML =
      '<div class="empty card"><h3>载入失败</h3><p>' + (e && e.message ? e.message : "未知错误") + "</p></div>";
  });
  window.addEventListener("beforeunload", function (e) {
    if (Store.state.dirty) { e.preventDefault(); e.returnValue = ""; }
  });
})();
</script>
</body>
</html>
